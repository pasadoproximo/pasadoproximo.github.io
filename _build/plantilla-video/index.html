<!doctype html>
<!--
  Plantilla de vídeo de los proyectos (brief, 1.3): la misma estética que el porfolio.
  Intro de 2 s → la grabación dentro de una ficha, con rótulos en fichas → cierre de 2 s con «Lo que puedo afirmar».
  Uso: servir el repo (python -m http.server 8000) y abrir
    /_build/plantilla-video/?f=169&s=intro      (f = 169 o 916 · s = intro, cuerpo o cierre)
  Sin «s», recorre las tres pantallas en bucle (vista previa). Con «grabar=1», la ficha central carga la sesión real
  (/_build/consejo-sesion/, mismo origen) y un script de Playwright la mueve con window.__ir, window.__cap,
  window.__scroll y window.__bar (ver _build/grabar_consejo_plantilla.js).
-->
<html lang="es"><head><meta charset="utf-8"><title>Plantilla de vídeo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
html,body{margin:0;background:#c9cfdc}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
.esc{transform-origin:center}
.v{position:relative;overflow:hidden;background:#F2F4F9;color:#061033;font-family:"Alegreya Sans",system-ui,sans-serif}
.v.f169{width:1280px;height:720px}.v.f916{width:1080px;height:1920px}
.serif{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.96;margin:0}
/* barra fina arriba: progreso del vídeo, verde al terminar (como en la web) */
.barra{position:absolute;left:0;right:0;top:0;height:6px;background:#E1E6F0;z-index:5}
.barra i{display:block;height:100%;background:#A3322A;width:0;transition:width .6s ease}
.cierre-on .barra i{background:#5E7D3A}
.lab{color:#A3322A;font-weight:600;margin:0}
.ficha{background:#fff;border:1px solid #061033;box-shadow:5px 5px 0 #9FB3FF;box-sizing:border-box}
.pant{position:absolute;inset:6px 0 0;opacity:0;transition:opacity .35s ease}
.pant.on{opacity:1}
.firma{position:absolute;display:flex;justify-content:space-between;align-items:baseline;color:#5A6480;font-weight:600}
.firma b{font-family:"Bricolage Grotesque";font-weight:800;color:#061033;letter-spacing:-.01em}

/* ---- 16:9 */
.f169 .intro{padding:120px 110px 0;display:flex;flex-direction:column;gap:26px}
.f169 .intro .lab{font-size:24px}
.f169 .intro h1{font-size:104px}
.f169 .cab{display:none}
.f169 .cierre .lab{font-size:22px}
.f916 .cierre .lab{font-size:34px}
.f169 .intro p:not(.lab){margin:0;font-size:30px;line-height:1.3;max-width:36ch;color:#2A3352}
.f169 .firma{left:110px;right:110px;bottom:44px;font-size:20px;border-top:1px solid #061033;padding-top:18px}
.f169 .firma b{font-size:22px}
.f169 .marco{position:absolute;left:150px;top:44px;width:980px;height:525px;overflow:hidden;box-shadow:8px 8px 0 #9FB3FF}
.f169 .marco img,.f169 .marco iframe{width:100%;display:block}
.marco iframe{height:100%;border:0}
.f169 .rotulo{position:absolute;left:84px;bottom:46px;max-width:760px;padding:18px 26px;display:flex;flex-direction:column;gap:6px}
.f169 .rotulo .lab{font-size:17px}
.f169 .rotulo p{margin:0;font-size:30px;font-weight:500;line-height:1.2}
.rotulo{transition:opacity .35s ease,transform .35s ease}.rotulo.off{opacity:0;transform:translateY(12px)}
.rotulo b{font-weight:700}
.f169 .esquina{position:absolute;right:84px;bottom:58px;font-size:17px;font-weight:600;color:#5A6480}
.f169 .cierre{padding:84px 110px 0;display:flex;flex-direction:column;gap:22px}
.f169 .cierre h2{font-size:64px}
.f169 .fila{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:baseline;padding:16px 0;border-top:1px solid #E1E6F0;font-size:26px;line-height:1.25}
.f169 .fila span{font-size:20px;font-weight:600}

/* ---- 9:16 */
.f916 .intro{padding:300px 90px 0;display:flex;flex-direction:column;gap:40px}
.f916 .intro .lab{font-size:36px}
.f916 .intro h1{font-size:150px}
.f916 .intro p:not(.lab){margin:0;font-size:44px;line-height:1.3;color:#2A3352}
.f916 .firma{left:90px;right:90px;bottom:110px;font-size:30px;border-top:1px solid #061033;padding-top:26px;flex-direction:column;gap:6px}
.f916 .firma b{font-size:36px}
.f916 .cab{position:absolute;left:70px;right:70px;top:90px;display:flex;flex-direction:column;gap:10px}
.f916 .cab .lab{font-size:30px}
.f916 .cab h2{font-size:64px}
.f916 .marco{position:absolute;left:70px;top:290px;width:932px;height:1147px;overflow:hidden;box-shadow:10px 10px 0 #9FB3FF}
.f916 .marco img,.f916 .marco iframe{width:100%;display:block}
.f916 .rotulo{position:absolute;left:70px;right:78px;top:1500px;padding:30px 36px;display:flex;flex-direction:column;gap:10px}
.f916 .rotulo .lab{font-size:28px}
.f916 .rotulo p{margin:0;font-size:46px;font-weight:500;line-height:1.2}
.f916 .esquina{position:absolute;left:70px;bottom:90px;font-size:30px;font-weight:600;color:#5A6480}
.f916 .cierre{padding:220px 90px 0;display:flex;flex-direction:column;gap:30px}
.f916 .cierre h2{font-size:104px}
.f916 .fila{display:flex;flex-direction:column;gap:8px;padding:30px 0;border-top:1px solid #E1E6F0;font-size:42px;line-height:1.25}
.f916 .fila span{font-size:30px;font-weight:600}
/* la sesión ocupa todo el vídeo (Jorge: nada de una pantalla dentro de otra); los carteles van encima */
.cuerpo .marco{left:0!important;top:0!important;right:0;bottom:0;width:auto!important;height:auto!important;border:0;box-shadow:none!important}
.cuerpo .marco img{height:100%;object-fit:cover;object-position:top}
.cuerpo .cab,.cuerpo .esquina{display:none}
/* cartel centrado abajo (Jorge) */
.f169 .rotulo{left:0;right:0;margin:0 auto;width:fit-content;bottom:40px;text-align:center}
.f916 .rotulo{top:auto;bottom:120px;left:0;right:0;margin:0 auto;width:fit-content;max-width:940px;text-align:center}
.rotulo{box-shadow:6px 6px 0 #9FB3FF}
/* 9:16: la sesión como en un móvil (540 px) y ampliada al doble, para que se lea en el teléfono */
.f916 .cuerpo .marco iframe{width:540px!important;height:957px!important;transform:scale(2);transform-origin:0 0}
/* fondo navy, como el botón, para que el vídeo contraste en la página (Jorge); carteles y fichas, igual.
   En navy los textos pasan a claros con acentos sky, como los bloques oscuros del porfolio (1.1) */
.v{background:#061033;color:#fff}
.barra{background:rgba(255,255,255,.14)}
.intro h1,.cierre h2,.firma b{color:#fff}
.intro .lab,.cierre .lab{color:#9FB3FF!important}
.intro p:not(.lab){color:#E6EBF8!important}
.firma{border-top-color:rgba(159,179,255,.5)!important;color:#B8C2DE}
.fila{border-top-color:rgba(159,179,255,.25)!important;color:#E6EBF8}
.ficha{color:#061033}.ficha .lab{color:#A3322A}
</style></head><body>
<div class="esc"><div class="v" id="v">
  <div class="barra"><i id="bar"></i></div>

  <section class="pant intro" data-s="intro">
    <p class="lab" data-t="lab"></p>
    <h1 class="serif" data-t="titulo"></h1>
    <p data-t="sub"></p>
    <div class="firma"><b>Jorge Delgado Aguilera</b><span>pasadoproximo.github.io</span></div>
  </section>

  <section class="pant cuerpo" data-s="cuerpo">
    <div class="cab"><p class="lab" data-t="lab"></p><h2 class="serif" data-t="titulo"></h2></div>
    <div class="ficha marco"><img id="muestra" alt=""></div>
    <div class="ficha rotulo"><p class="lab" data-t="rot_lab"></p><p data-t="rot"></p></div>
    <span class="esquina">pasadoproximo.github.io</span>
  </section>

  <section class="pant cierre" data-s="cierre">
    <p class="lab" data-t="lab"></p>
    <h2 class="serif">Lo que puedo afirmar</h2>
    <div id="filas"></div>
    <div class="firma"><b>Jorge Delgado Aguilera</b><span>pasadoproximo.github.io</span></div>
  </section>
</div></div>
<script>
// Textos de cada proyecto: los de su página (data.py). El rótulo es uno de los del vídeo actual.
var P = {
  "consejo-de-clio": {
    lab: "Ficha de trabajo · El Consejo de Clío",
    titulo: "El Consejo de Clío",
    sub: "Seis agentes de IA preparan una sesión a partir de una noticia. El docente la contrasta antes de llevarla al aula.",
    rot_lab: "3 · Ibn Jaldún revisa",
    rot: "Ibn Jaldún lo corrige. En 1991 decidieron las repúblicas",
    afirmar: [["Comprobado", "#A8C686", "Ibn Jaldún ha detectado varios fallos en las numerosas pruebas que he realizado."],
              ["En uso", "#F2A196", "Recurso abierto a disposición de los docentes."],
              ["Pendiente", "#B8C2DE", "Medir si las sesiones ahorran tiempo real y cuántos errores deja pasar el revisor."]]
  }
};
var q = new URLSearchParams(location.search), f = q.get("f") === "916" ? "916" : "169", d = P[q.get("p") || "consejo-de-clio"];
var v = document.getElementById("v"); v.className = "v f" + f;
document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = d[e.getAttribute("data-t")]; });
document.getElementById("muestra").src = "muestra-" + f + ".jpg";
document.getElementById("filas").innerHTML = d.afirmar.map(function (a) {
  return '<div class="fila"><span style="color:' + a[1] + '">' + a[0] + '</span><div>' + a[2] + '</div></div>';
}).join("");
var PROG = { intro: 6, cuerpo: 55, cierre: 100 };
function ir(s) {
  document.querySelectorAll(".pant").forEach(function (p) { p.classList.toggle("on", p.getAttribute("data-s") === s); });
  v.classList.toggle("cierre-on", s === "cierre");
  document.getElementById("bar").style.width = PROG[s] + "%";
}
// encajar en la ventana para verla entera
function encaja() {
  var w = f === "916" ? 1080 : 1280, h = f === "916" ? 1920 : 720;
  var k = q.get("s") || q.get("grabar") ? 1 : Math.min(innerWidth / w, innerHeight / h) * .96;  // al grabar, a tamaño real
  document.querySelector(".esc").style.transform = "scale(" + k + ")";
}
addEventListener("resize", encaja); encaja();
if (q.get("grabar")) {
  // modo de grabación: la sesión real en la ficha central y control desde fuera
  var m = document.querySelector(".marco"); m.innerHTML = '<iframe src="/_build/consejo-sesion/" title="Sesión real del Consejo de Clío"></iframe>';
  m.querySelector("iframe").addEventListener("load", function () {
    var st = this.contentDocument.createElement("style");
    st.textContent = "body{background:#061033!important}header .header-top,header h1,.autor strong,.acta-head h2,.separador span{color:#fff!important}" +
      ".eyebrow,.autor,.lede,.acta-head .badge,.separador small{color:#B8C2DE!important}.separador{border-top-color:rgba(159,179,255,.35)!important}";
    this.contentDocument.head.appendChild(st);
  });
  var rot = document.querySelector(".rotulo"), rl = rot.querySelector(".lab"), rt = rot.querySelector("p:not(.lab)");
  window.__ir = ir;
  window.__bar = function (pct, ms) { var b = document.getElementById("bar"); b.style.transition = "width " + (ms || 600) + "ms linear"; b.style.width = pct + "%"; };
  window.__cap = function (lab, html) { return new Promise(function (r) {
    var show = function () { if (html) { rl.textContent = lab; rt.innerHTML = html; rot.classList.remove("off"); } r(); };
    if (!rot.classList.contains("off")) { rot.classList.add("off"); setTimeout(show, 380); } else show(); }); };
  // desplazamiento suave dentro de la sesión hasta un elemento (con su margen arriba), en ms
  window.__scroll = function (sel, ms, arriba) { return new Promise(function (r) {
    var w = m.querySelector("iframe").contentWindow, doc = w.document, el = typeof sel === "number" ? null : doc.querySelector(sel);
    var y0 = w.scrollY, y1 = Math.max(0, Math.min(doc.documentElement.scrollHeight - w.innerHeight, el ? el.getBoundingClientRect().top + w.scrollY - (arriba || 0) : sel));
    var t0 = performance.now(), ease = function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
    (function paso(now) { var t = Math.min(1, (now - t0) / ms); w.scrollTo(0, y0 + (y1 - y0) * ease(t)); t < 1 ? requestAnimationFrame(paso) : r(); })(t0);
  }); };
  rot.classList.add("off"); document.getElementById("bar").style.transition = "none"; ir("intro");
} else if (q.get("s")) { document.querySelectorAll(".pant").forEach(function (p) { p.style.transition = "none"; }); document.getElementById("bar").style.transition = "none"; ir(q.get("s")); }
else { var orden = ["intro", "cuerpo", "cierre"], t = [2000, 4000, 2000], i = 0; (function sig() { ir(orden[i]); setTimeout(sig, t[i]); i = (i + 1) % 3; })(); }
</script>
</body></html>
