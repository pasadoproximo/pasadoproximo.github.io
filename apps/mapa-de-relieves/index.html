const QUIZ={"paleozoico": [{"q": "¿Qué orogénesis se produce a finales de la Era Primaria?", "o": ["Cadomiense", "Herciniana", "Alpina"], "a": 1, "e": "Hace unos 300 millones de años los sedimentos marinos se pliegan y surgen las cordilleras hercinianas."}, {"q": "¿Qué parte de la Península surge principalmente?", "o": ["Los Sistemas Béticos", "La zona occidental, la futura Meseta", "Los Pirineos"], "a": 1, "e": "La herciniana levanta sobre todo el oeste, que será la Meseta."}, {"q": "¿Qué tipo de etapa es la Era Primaria?", "o": ["De calma orogénica", "De sedimentación sin tectónica", "De compresión"], "a": 2, "e": "Es una etapa de compresión de las placas tectónicas."}, {"q": "Según el PPS, ¿qué tres macizos forma la orogenia herciniana?", "o": ["Sistema Central, Montes de Toledo y Sierra Morena", "Galaico-Duriense, Catalano-Balear y del Ebro, y Bético-Rifeño", "Pirineos, Béticos e Ibérico"], "a": 1, "e": "Son tres macizos de pizarras y cuarcitas separados por geosinclinales marinos."}], "mesozoico": [{"q": "¿Qué tipo de etapa es la Era Secundaria?", "o": ["De compresión", "De calma orogénica", "De vulcanismo intenso"], "a": 1, "e": "No hay orogénesis: domina la erosión y la sedimentación."}, {"q": "¿Qué les ocurre a las cordilleras hercinianas?", "o": ["Se pliegan de nuevo", "Se hunden bajo el mar", "Se erosionan y se convierten en macizos"], "a": 2, "e": "Así se forman el macizo Hespérico y otros macizos."}, {"q": "¿Dónde se depositan los sedimentos?", "o": ["En las fosas pirenaica y bética, en el mar de Tethis", "En la depresión del Ebro", "En el centro de la Meseta"], "a": 0, "e": "Esos sedimentos se plegarán después en la orogénesis alpina."}, {"q": "¿Cómo era la capa de sedimentos en el borde del macizo Hespérico?", "o": ["Más gruesa", "No había sedimentos", "Más delgada"], "a": 2, "e": "Esa capa delgada dará lugar a las cordilleras de cobertera."}], "cenozoico": [{"q": "¿Qué orogénesis se produce en la Era Terciaria?", "o": ["Caledoniana", "Herciniana", "Alpina"], "a": 2, "e": "Es la principal responsable del relieve actual."}, {"q": "Los sedimentos gruesos de las fosas marinas se pliegan y forman…", "o": ["Sistema Central y Montes de Toledo", "Las depresiones del Ebro y Guadalquivir", "Pirineos y Sistemas Béticos"], "a": 2, "e": "Son las cordilleras alpinas."}, {"q": "Los sedimentos de menor espesor del borde del macizo forman…", "o": ["Los Pirineos", "Sierra Morena", "Cordilleras de cobertera: Sistema Ibérico y Cantábrico"], "a": 2, "e": "Se pliegan encima del zócalo."}, {"q": "¿Qué son las depresiones prealpinas?", "o": ["Las depresiones del Ebro y del Guadalquivir", "Las submesetas norte y sur", "Los valles glaciares"], "a": 0, "e": "Quedan hundidas entre las cordilleras alpinas y el macizo antiguo."}, {"q": "¿Qué le pasa al zócalo rígido de la Meseta?", "o": ["Se pliega", "Se hunde bajo el mar", "Se fractura en bloques"], "a": 2, "e": "Así surgen las cordilleras de bloques, como el Sistema Central."}, {"q": "Según el PPS, ¿hacia dónde se inclina la Meseta?", "o": ["Hacia el este", "Hacia el sur", "Hacia el oeste"], "a": 2, "e": "Por eso los grandes ríos de la Meseta van hacia el Atlántico."}], "cuaternario": [{"q": "¿Desde cuándo dura la Era Cuaternaria?", "o": ["Desde hace 1,7 millones de años", "Desde hace 230 millones de años", "Desde hace 68 millones de años"], "a": 0, "e": "Es la era actual."}, {"q": "¿Qué tipo de etapa es?", "o": ["De compresión", "De orogénesis alpina", "De calma orogénica"], "a": 2, "e": "Predominan la erosión y la sedimentación."}, {"q": "¿Cuáles son los principales agentes erosivos?", "o": ["Los glaciares y los ríos", "Los volcanes", "Las placas tectónicas"], "a": 0, "e": "Glaciarismo en las cumbres y acción fluvial en los valles."}, {"q": "¿A qué se deben las terrazas fluviales?", "o": ["A la orogénesis alpina", "A la alternancia de periodos glaciares e interglaciares", "A las erupciones volcánicas"], "a": 1, "e": "En los glaciares el río deposita; en los interglaciares excava."}, {"q": "Según el PPS, ¿dónde hubo glaciares?", "o": ["Depresiones del Ebro y Guadalquivir", "Las submesetas", "Picos de Europa, Pirineos, Montes de León, Sierra Nevada y Sistema Central"], "a": 2, "e": "Afectó a las cumbres más altas."}], "unidades": [{"q": "¿Cuáles son los relieves interiores de la Meseta?", "o": ["Cordillera Cantábrica y Sistema Ibérico", "Sistema Central y Montes de Toledo", "Pirineos y Béticos"], "a": 1, "e": "Los bordes son Montes de León, Cantábrica, Ibérico y Sierra Morena."}, {"q": "Según la tabla, ¿qué origen tiene el Sistema Central?", "o": ["Cordillera alpina plegada", "Antiguo macizo paleozoico", "Cordillera plegada sobre zócalo"], "a": 1, "e": "Igual que Montes de Toledo, Sierra Morena, Macizo Galaico y Montes de León."}, {"q": "¿Qué origen tiene el Sistema Ibérico?", "o": ["Antiguo macizo paleozoico", "Cordillera plegada sobre zócalo", "Cordillera alpina plegada"], "a": 1, "e": "Igual que la Cordillera Cantábrica."}, {"q": "¿Cuál es la cumbre más alta de la tabla?", "o": ["Aneto (3.404 m)", "Mulhacén (3.478 m)", "Almanzor (2.592 m)"], "a": 1, "e": "Está en la Cordillera Bética."}, {"q": "¿Qué son las Baleares, menos Menorca?", "o": ["Una continuación de la Cordillera Subbética", "Restos del macizo Hespérico", "Un archipiélago volcánico"], "a": 0, "e": "Así lo explica el PPS."}, {"q": "¿Cuándo se forman las cadenas de cobertura?", "o": ["En la Era Terciaria, al plegarse la cobertera sobre el zócalo", "En la Era Cuaternaria", "En la Era Primaria"], "a": 0, "e": "Los sedimentos se depositaron en la Secundaria y se plegaron en la alpina."}], "aclinal": [{"q": "¿Cómo están los estratos en el relieve aclinal?", "o": ["Horizontales", "Inclinados", "Plegados"], "a": 0, "e": "No ha actuado la tectónica, o muy débilmente."}, {"q": "¿Dónde se localiza?", "o": ["En el centro de las cuencas sedimentarias", "En las cordilleras alpinas", "En los bordes de las cuencas"], "a": 0, "e": "Meseta, depresión del Ebro y del Guadalquivir."}, {"q": "¿Qué es la cornisa?", "o": ["La parte inferior, de roca blanda", "El fondo del valle", "La parte superior, de roca dura y fuerte pendiente"], "a": 2, "e": "Debajo está el talud, de roca blanda y pendiente suave."}, {"q": "¿Qué es un antecerro?", "o": ["Una plataforma muy extensa", "Un cerro que ya ha perdido el estrato duro", "Un cerro rematado por roca dura"], "a": 1, "e": "El cerro testigo aún conserva el estrato duro; el antecerro no."}, {"q": "¿Qué diferencia una mesa, una muela y un cerro testigo?", "o": ["La inclinación de los estratos", "El tipo de roca", "El tamaño"], "a": 2, "e": "De mayor a menor: superficie estructural, páramo, mesa, muela, cerro testigo y antecerro."}, {"q": "Según el PPS, ¿qué ejemplo de relieve tabular hay en España?", "o": ["La Hoya de Huesca", "El Torcal de Antequera", "Somiedo"], "a": 0, "e": "Allí se ven cerros testigo."}], "monoclinal": [{"q": "¿Cómo están los estratos en el relieve monoclinal?", "o": ["Inclinados (con buzamiento)", "Fracturados en bloques", "Horizontales"], "a": 0, "e": "Ha actuado algo la tectónica."}, {"q": "¿Cuáles son las dos partes de una cuesta?", "o": ["Horst y graben", "Frente y dorso", "Mont y val"], "a": 1, "e": "Tiene un perfil disimétrico."}, {"q": "¿Cómo es el dorso?", "o": ["Vertical", "De gran pendiente", "De pendiente suave, siguiendo los estratos"], "a": 2, "e": "El frente es el de gran pendiente."}, {"q": "¿Qué partes tiene el frente?", "o": ["Circo y lengua", "Charnela y flancos", "Cornisa y talud"], "a": 2, "e": "La cornisa en roca dura; el talud, de menor pendiente."}, {"q": "¿Dónde se localiza?", "o": ["En el zócalo del oeste", "En el centro de las cuencas", "En los bordes de las cuencas sedimentarias"], "a": 2, "e": "Por ejemplo, Teruel."}, {"q": "¿Qué deja el retroceso de la cuesta?", "o": ["Morrenas", "Cerros testigo y antecerros", "Dolinas y uvalas"], "a": 1, "e": "Se deben a la erosión de la red fluvial."}], "jurasico": [{"q": "¿Qué es un anticlinal?", "o": ["Un pliegue cóncavo", "Un pliegue convexo (hacia arriba)", "Un bloque levantado por fallas"], "a": 1, "e": "El sinclinal es el cóncavo."}, {"q": "¿Qué es el mont?", "o": ["La cima del anticlinal", "El fondo del sinclinal", "Un barranco en el flanco"], "a": 0, "e": "El val es el fondo del sinclinal."}, {"q": "¿Qué es una combe?", "o": ["Un valle en la charnela del anticlinal, paralelo a la cumbre", "El fondo del sinclinal", "Un corte transversal de un río"], "a": 0, "e": "Suele estar rodeada por crestas."}, {"q": "¿Qué es una cluse?", "o": ["Un corte de un río, perpendicular a la cumbre", "Un valle paralelo a la cumbre", "Una sucesión de ruces"], "a": 0, "e": "También se llaman hoces o foces."}, {"q": "¿Qué caracteriza al relieve invertido?", "o": ["Sinclinales colgados y anticlinales vaciados", "Pliegues intactos", "Bloques fracturados"], "a": 0, "e": "Lo alto pasa a ser bajo y al revés."}, {"q": "¿Qué es el relieve apalachense?", "o": ["Una cordillera joven sin erosionar", "Un relieve volcánico", "Una cordillera antigua arrasada y vuelta a levantar"], "a": 2, "e": "Plegamiento, arrasamiento, nuevo levantamiento y erosión diferencial."}, {"q": "¿Qué es una cluse muerta (wind gap)?", "o": ["Un paso entre crestas por el que ya no pasa ningún río", "Una cueva kárstica", "Un paso con un río activo"], "a": 0, "e": "La cluse viva sí tiene río."}, {"q": "¿Dónde hay relieve apalachense?", "o": ["Pirineos y Béticos", "Eo y Navia, Somiedo, Montes de Toledo y Sierra Morena", "Depresión del Ebro"], "a": 1, "e": "Son cordilleras antiguas rejuvenecidas."}], "fallado": [{"q": "¿Sobre qué rocas se da el relieve germánico o fallado?", "o": ["Sedimentos recientes sin consolidar", "Rocas blandas", "Rocas duras y rígidas"], "a": 2, "e": "Al no poder plegarse, se fracturan."}, {"q": "¿Qué es un horst?", "o": ["Un bloque levantado entre fallas", "Un bloque hundido", "Un pliegue convexo"], "a": 0, "e": "Corresponde a las sierras."}, {"q": "¿Qué es un graben?", "o": ["Una fosa hundida entre fallas", "Un valle glaciar", "Un bloque levantado"], "a": 0, "e": "Suele estar ocupado por valles fluviales."}, {"q": "¿Qué produce una falla normal?", "o": ["Fuerzas de tensión", "Fuerzas de compresión", "La disolución de la caliza"], "a": 0, "e": "La falla inversa es por compresión."}, {"q": "¿Qué es el labio hundido?", "o": ["La superficie de la falla", "El bloque que queda por encima", "El bloque que queda por debajo del plano de falla"], "a": 2, "e": "El de arriba es el labio levantado."}, {"q": "Según el PPS, ¿dónde hay relieve germánico?", "o": ["Bordes de la Meseta", "Montes de León, Sistema Central y Montes de Toledo", "Pirineos y Béticos"], "a": 1, "e": "Es el interior fracturado de la Meseta."}], "sajonico": [{"q": "¿Qué es el relieve sajónico?", "o": ["Un relieve solo de fallas", "Un relieve plegado sobre un zócalo fracturado", "Un relieve solo de pliegues"], "a": 1, "e": "Mezcla el estilo germánico y el jurásico."}, {"q": "¿Por qué se forma?", "o": ["Por erupciones volcánicas", "Hay sedimentos sobre un zócalo antes de la compresión", "Por la erosión de una cordillera antigua"], "a": 1, "e": "El zócalo se fractura y los sedimentos de encima se pliegan."}, {"q": "Según el PPS, ¿dónde se encuentra?", "o": ["Pirineos y Béticos", "Interior de la Meseta", "Bordes de la Meseta: Cantábrico, Ibérico, Sierra Morena y Macizo Galaico"], "a": 2, "e": "La Meseta arruga sus bordes en la orogenia alpina."}], "litologia": [{"q": "¿De qué era son las rocas silíceas?", "o": ["De la Secundaria", "Del Terciario y Cuaternario", "De la Primaria y anteriores"], "a": 2, "e": "Son las más antiguas."}, {"q": "¿Qué rocas forman el dominio calizo?", "o": ["Caliza, conglomerados y areniscas", "Arcillas, margas y yesos", "Granito y pizarra"], "a": 0, "e": "Sedimentadas en la Secundaria y plegadas en la alpina."}, {"q": "¿Cómo son las rocas del dominio arcilloso?", "o": ["Volcánicas", "Sedimentarias no plegadas y recientes", "Metamórficas muy antiguas"], "a": 1, "e": "Del Terciario y Cuaternario."}, {"q": "¿Dónde está el dominio volcánico?", "o": ["Z invertida", "Oeste peninsular", "Canarias, Campo de Calatrava, cabo de Gata y Olot-Garrotxa"], "a": 2, "e": "Son erupciones del Terciario y Cuaternario."}, {"q": "¿Cómo se forman las rocas plutónicas, como el granito?", "o": ["Por enfriamiento del magma en profundidad", "Por depósito de sedimentos", "Por enfriamiento en superficie"], "a": 0, "e": "Si se enfría en superficie son volcánicas."}, {"q": "¿Qué es una roca metamórfica?", "o": ["Lava solidificada", "Una roca formada por sedimentos", "Una roca transformada por otra presión o temperatura"], "a": 2, "e": "Ejemplos: mármol, pizarra, gneis y cuarcita."}], "siliceo": [{"q": "¿Cuál es la roca más característica del modelado silíceo?", "o": ["El granito", "La caliza", "La arcilla"], "a": 0, "e": "Junto con pizarras, cuarcitas y gneis."}, {"q": "¿Ante qué meteorización es sensible el granito?", "o": ["La química", "La mecánica", "Ninguna"], "a": 0, "e": "Es muy resistente a la mecánica."}, {"q": "¿Qué son las diaclasas?", "o": ["Fisuras de la roca", "Cuevas", "Bolas de granito"], "a": 0, "e": "En ellas se concentra la erosión."}, {"q": "¿En qué se diferencian berrocal y canchal?", "o": ["Son lo mismo", "Berrocal anguloso; canchal redondeado", "Berrocal de perfil redondeado; canchal anguloso"], "a": 2, "e": "El canchal acumula fragmentos angulosos."}, {"q": "¿Qué es una piedra caballera?", "o": ["Un conjunto de bolas apiladas", "Una cavidad en la roca", "Una bola sobre otra más pequeña, en equilibrio"], "a": 2, "e": "Las bolas apiladas son un tor."}, {"q": "¿Qué es un pilancón?", "o": ["Una cresta afilada", "Un surco vertical", "Una concavidad en lo alto de un bolo o domo"], "a": 2, "e": "Se forma por hidrólisis del agua retenida."}, {"q": "¿Dónde se localiza el modelado silíceo?", "o": ["En la Z invertida", "En el oeste peninsular y la zona axial del Pirineo", "En las depresiones del Ebro y Guadalquivir"], "a": 1, "e": "Es el zócalo paleozoico."}], "karst": [{"q": "¿Qué proceso origina el karst?", "o": ["La erosión eólica", "La gelifracción", "La disolución del carbonato cálcico"], "a": 2, "e": "El agua con CO₂ se vuelve ácida y disuelve la caliza."}, {"q": "¿Qué es una uvala?", "o": ["Una gran depresión de fondo plano", "La unión de varias dolinas", "Una columna de caliza"], "a": 1, "e": "El poljé es la gran depresión de fondo plano."}, {"q": "¿Qué es un poljé?", "o": ["Una gran depresión alargada de fondo plano", "Una roca en forma de seta", "Un embudo vertical"], "a": 0, "e": "Puede tener un río que desaparece por un ponor."}, {"q": "¿Qué es la terra rossa?", "o": ["Un tipo de estalactita", "Lava enfriada", "Arcilla roja del fondo de las dolinas"], "a": 2, "e": "Es el residuo no soluble de la caliza."}, {"q": "¿Qué es una estalagmita?", "o": ["Una formación que crece desde el suelo", "Un pozo vertical", "Una formación que cuelga del techo"], "a": 0, "e": "La estalactita cuelga del techo; si se unen forman una columna."}, {"q": "¿Con qué forma se distribuye el karst en España?", "o": ["Una Z invertida", "Una línea por el oeste", "Un círculo en el centro"], "a": 0, "e": "Pirineos, Montes Vascos, Cantábrica oriental, Ibérico y Béticas."}, {"q": "¿Qué ejemplo de karst hay en Málaga?", "o": ["La Hoya de Huesca", "El cabo de Gata", "El Torcal de Antequera"], "a": 2, "e": "También la cueva de Nerja."}], "arcilloso": [{"q": "¿Qué materiales forman el relieve arcilloso?", "o": ["Arcillas, margas y yesos", "Basalto", "Granito y gneis"], "a": 0, "e": "Son blandos y se erosionan con facilidad."}, {"q": "¿Cómo están sus capas?", "o": ["Horizontales, sin plegar", "Fracturadas en bloques", "Muy plegadas"], "a": 0, "e": "Se depositaron después de la orogénesis alpina."}, {"q": "¿Dónde se forman las cárcavas?", "o": ["En costas acantiladas", "En clima semiárido, con lluvias torrenciales y sin vegetación", "En alta montaña"], "a": 1, "e": "Son surcos estrechos y profundos."}, {"q": "¿Qué es un badland?", "o": ["Un paisaje de cárcavas en una zona amplia", "Una cueva", "Una llanura ondulada"], "a": 0, "e": "Ejemplo: el Desierto de Tabernas."}, {"q": "¿Qué forma suave dan los ríos en estos materiales?", "o": ["Crestas", "Domos", "Campiñas"], "a": 2, "e": "Llanuras suavemente onduladas."}], "volcanico": [{"q": "¿Qué es una caldera?", "o": ["Un manto de lava", "Una meseta basáltica", "Una gran depresión por explosión o hundimiento del volcán"], "a": 2, "e": "Está rodeada por un fuerte escarpe."}, {"q": "¿Qué es una colada?", "o": ["Una roca en forma de seta", "Un manto de lava que baja por la ladera", "La boca del volcán"], "a": 1, "e": "Sus características dependen del magma y del relieve."}, {"q": "¿Qué son los trapps?", "o": ["Zonas de coladas solidificadas", "Restos de chimeneas", "Mesetas basálticas con escarpes escalonados"], "a": 2, "e": "Cubren grandes áreas."}, {"q": "¿Qué es un malpaís?", "o": ["Una laguna volcánica", "Una zona de coladas de lava solidificadas", "Un cono de cenizas"], "a": 1, "e": "Ejemplo: el malpaís del Teide."}, {"q": "¿Qué son los roques?", "o": ["Bombas volcánicas", "Calderas pequeñas", "Lava de la chimenea que la erosión deja al descubierto"], "a": 2, "e": "Como el Roque de los Muchachos."}, {"q": "¿Dónde hay volcanes en la Península?", "o": ["Sistema Central y Montes de Toledo", "Campo de Calatrava, cabo de Gata y La Garrotxa", "Pirineos"], "a": 1, "e": "Fuera de la Península, Canarias."}, {"q": "¿En qué isla están la Caldera de Taburiente y el Roque de los Muchachos?", "o": ["Gran Canaria", "La Palma", "La Gomera"], "a": 1, "e": "Ojo: el PPS lo rotula mal."}], "glaciar": [{"q": "¿Qué tiene un glaciar de circo o pirenaico?", "o": ["Solo lengua", "Solo circo", "Circo, lengua y zona de ablación"], "a": 1, "e": "El de valle o alpino tiene también lengua."}, {"q": "¿Qué forma tiene un valle glaciar?", "o": ["De V", "De cañón", "De U o artesa"], "a": 2, "e": "El valle fluvial tiene forma de V."}, {"q": "¿Qué son las morrenas?", "o": ["Acumulaciones de rocas arrastradas por el glaciar", "Lagos de alta montaña", "Grietas en el hielo"], "a": 0, "e": "La frontal puede cerrar el valle y formar un lago."}, {"q": "¿Dónde hay glaciares activos hoy en España?", "o": ["En el Sistema Central", "En Sierra Nevada", "En las cumbres más altas del Pirineo"], "a": 2, "e": "En el pasado afectaron a casi todas las cordilleras."}, {"q": "¿Qué lagos son de origen glaciar?", "o": ["Covadonga, Peñalara, Laguna Negra y Sanabria", "Las lagunas de Ruidera", "Albufera de Valencia y Doñana"], "a": 0, "e": "Ocupan antiguos circos."}, {"q": "¿Qué procesos produce el periglaciarismo?", "o": ["Deflación y abrasión", "Gelifracción y solifluxión", "Disolución y precipitación"], "a": 1, "e": "Se debe a la alternancia de hielo y deshielo."}], "costa": [{"q": "¿Qué predomina en el curso alto de un río?", "o": ["El transporte solo", "La sedimentación", "La erosión"], "a": 2, "e": "Hay mucha pendiente y velocidad."}, {"q": "¿Qué predomina en el curso bajo?", "o": ["La sedimentación", "La excavación de cañones", "La erosión"], "a": 0, "e": "Hay poca pendiente: se forma la vega."}, {"q": "¿Cómo se forma un meandro?", "o": ["Erosión en la orilla exterior y depósito en la interior", "Por una falla", "Por la acción del hielo"], "a": 0, "e": "Si el río se endereza, queda un meandro abandonado."}, {"q": "¿Qué son las terrazas fluviales?", "o": ["Islas en la desembocadura", "Cascadas", "Plataformas escalonadas a los lados del cauce"], "a": 2, "e": "Se deben a la alternancia de periodos glaciares e interglaciares."}, {"q": "¿Dónde se forma un delta?", "o": ["En el curso alto", "En mares muy agitados", "Donde el mar es tranquilo"], "a": 2, "e": "En mares agitados se forma un estuario."}, {"q": "¿Dónde está el delta del Ebro según tu PPS?", "o": ["En la desembocadura del Ebro, en el Mediterráneo", "En el Cantábrico", "En el Atlántico gallego"], "a": 0, "e": "Es un territorio adosado al continente formado por los sedimentos del río."}], "marina": [{"q": "¿Qué son las formas de ablación?", "o": ["Las que crean los ríos", "Las que crea la acción destructiva del mar", "Las que crea la sedimentación marina"], "a": 1, "e": "Acantilados y plataformas de abrasión."}, {"q": "¿Qué es un acantilado muerto?", "o": ["Uno sin vegetación", "Uno que el mar ya no golpea", "Uno que el mar sigue erosionando"], "a": 1, "e": "Queda separado del mar por la acumulación de sus propios materiales."}, {"q": "¿Dónde está la plataforma de abrasión?", "o": ["Detrás de las marismas", "En la desembocadura de los ríos", "Al pie de los acantilados"], "a": 2, "e": "Es una rampa con resaltes y acanaladuras."}, {"q": "¿Cuál de estas es una forma de acumulación?", "o": ["El acantilado", "La plataforma de abrasión", "La marisma"], "a": 2, "e": "Playas, marismas y arrecifes son de acumulación."}, {"q": "¿Qué caracteriza a una marisma?", "o": ["Arcillas y materia orgánica con aguas estancadas", "Paredes verticales de roca dura", "Arenas y gravas con mucha pendiente"], "a": 0, "e": "Por ejemplo, las marismas de Doñana."}], "rasgos": [{"q": "¿Cuál es la altitud media de la Península?", "o": ["300 m", "660 m", "1.200 m"], "a": 1, "e": "Se debe a sus cordilleras y a la Meseta."}, {"q": "¿Qué significa que tiene forma maciza?", "o": ["Es muy ancha y tiene costas rectilíneas", "Es muy montañosa", "Tiene muchas islas"], "a": 0, "e": "Mide 1.094 km de oeste a este."}, {"q": "¿Qué efecto tienen los relieves periféricos?", "o": ["Frenan la influencia del mar hacia el interior", "Suavizan el clima del interior", "Facilitan las comunicaciones"], "a": 0, "e": "Por eso el litoral es más suave que el interior."}, {"q": "¿Qué hacen los procesos endógenos?", "o": ["Lo transportan", "Lo modelan y desgastan", "Construyen el relieve"], "a": 2, "e": "Los exógenos lo modelan; el principal agente es el agua."}], "meteorizacion": [{"q": "¿Qué diferencia la meteorización de la erosión?", "o": ["No hay diferencia", "La erosión no incluye transporte", "La meteorización no incluye transporte"], "a": 2, "e": "La erosión arranca, transporta y sedimenta."}, {"q": "¿De qué dos factores depende la meteorización?", "o": ["De la altitud y la latitud", "Del clima y de la naturaleza de las rocas", "De la tectónica y los volcanes"], "a": 1, "e": "Así lo dicen tus apuntes."}, {"q": "¿Qué tipo de meteorización es la gelifracción?", "o": ["Química", "Física", "Biológica"], "a": 1, "e": "El agua se congela en las grietas y rompe la roca."}, {"q": "¿Qué es la termoclastia?", "o": ["La disolución de la caliza", "La rotura por la sal", "La rotura por el contraste de temperatura día-noche"], "a": 2, "e": "Frecuente en el granito y con gran amplitud térmica."}, {"q": "¿Qué tipo de meteorización es la hidrólisis?", "o": ["Física", "Química", "Eólica"], "a": 1, "e": "Transforma el feldespato en arcilla."}, {"q": "¿Qué deja la laterización?", "o": ["Arenas de cuarzo", "Estalactitas", "Una costra dura de hierro y aluminio"], "a": 2, "e": "Es la laterita; los suelos son poco fértiles."}], "laminar": [{"q": "¿Qué provoca la erosión laminar?", "o": ["El hielo", "Las precipitaciones", "El viento"], "a": 1, "e": "Las gotas de lluvia sueltan partículas que el agua arrastra."}, {"q": "¿Qué es el arroyamiento?", "o": ["El movimiento de un glaciar", "Un río en su curso bajo", "Pequeñas corrientes de agua de lluvia por las pendientes"], "a": 2, "e": "De él nacen torrentes, arroyos y ríos."}, {"q": "¿Qué se forma al pie de las vertientes?", "o": ["Conos y glacis", "Morrenas", "Dolinas"], "a": 0, "e": "Se acumulan los materiales arrastrados."}, {"q": "¿Dónde aparecen surcos y cárcavas?", "o": ["Sobre granito sano", "En bosques densos", "En terrenos sin vegetación y con rocas poco resistentes"], "a": 2, "e": "La falta de vegetación deja el suelo desprotegido."}], "eolica": [{"q": "¿Qué favorece la erosión eólica?", "o": ["La falta de vegetación", "El relieve muy abrupto", "La abundante humedad"], "a": 0, "e": "También los materiales sueltos y la topografía suave."}, {"q": "¿Cómo transporta el viento las partículas?", "o": ["Solo por arrastre", "Por arrastre, saltación y suspensión", "Por disolución"], "a": 1, "e": "Depende de su tamaño."}, {"q": "¿Qué forma la deflación?", "o": ["Rocas en forma de seta", "Cárcavas", "Hoyas"], "a": 2, "e": "El viento levanta las partículas finas."}, {"q": "¿Qué forma la abrasión eólica?", "o": ["Hoyas", "Dunas", "Acanaladuras y rocas en forma de seta"], "a": 2, "e": "Las partículas cortantes desgastan la roca."}], "cronologia": [{"q": "¿Qué orogénesis forma el relieve actual de la Península?", "o": ["Cadomiense", "Herciniana", "Alpina"], "a": 2, "e": "Se produce en la Era Terciaria."}, {"q": "¿En qué era se produce la orogénesis herciniana?", "o": ["En el Cuaternario", "En la Era Secundaria", "En la Era Primaria"], "a": 2, "e": "A finales del Paleozoico (Carbonífero-Pérmico)."}, {"q": "¿Qué hizo emerger la orogenia cadomiense?", "o": ["Los Pirineos", "El zócalo hespérico", "Las Canarias"], "a": 1, "e": "Pizarras y gneis del oeste peninsular, en el Precámbrico."}, {"q": "¿Qué es la Protomeseta?", "o": ["El zócalo elevado e inclinado al este por la orogenia caledoniana", "Una depresión terciaria", "La Meseta actual"], "a": 0, "e": "Según el PPS, en el Ordovícico."}, {"q": "¿Qué eras son de calma orogénica?", "o": ["La Primaria y la Terciaria", "La Secundaria y la Cuaternaria", "Solo el Precámbrico"], "a": 1, "e": "En ellas domina la erosión y la sedimentación."}]};
const TABLAYER={"jurasico": {"4": "apalachense"}};
const MAPLAYER={unidades:'unidades',litologia:'litologia',costa:'fluvial',marina:'costa'};
let cur=null;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function show(k,tab){
  cur=k;
  const layer=MAPLAYER[k]||(['rasgos','procesos','repaso','placas','meteorizacion','laminar','eolica','cronologia'].includes(k)?null:k);
  document.querySelectorAll('.layer').forEach(e=>e.classList.toggle('on',layer&&e.id==='L-'+layer));
  document.querySelectorAll('button[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===k));
  const general=['rasgos','procesos','repaso','placas','meteorizacion','laminar','eolica','cronologia'].includes(k);
  document.getElementById('loc').style.display=general?'none':'';
  document.getElementById('ixl').textContent=(['unidades','litologia','precambrico','paleozoico','mesozoico','cenozoico','cuaternario'].includes(k))?'En el mapa:':'Ubicación:';
  const lg=LEG[k], legEl=document.getElementById('leg');
  document.getElementById('ix').style.display=lg?'none':'';
  legEl.innerHTML=lg?lg.map(([t,c,l,d])=>'<div class="li"><i class="sw sw-'+t+'" style="--sw:'+c+'"></i><div><div>'+l+'</div>'+(d?'<div class="ld">'+d+'</div>':'')+'</div></div>').join(''):'';
  document.getElementById('ixt').textContent=D[k];
  document.getElementById('ft').textContent=TITLES[k];
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  FICHAS[k].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t[0];b.setAttribute('role','tab');b.onclick=()=>openTab(i);tabs.appendChild(b);});
  store('relieve-sel',k);
  openTab(Math.min(tab||0,FICHAS[k].length-1));
}
function openTab(i){
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',i===j));
  const tl=(TABLAYER[cur]||{})[String(i)], lay=tl||cur;
  if(TABLAYER[cur]){document.querySelectorAll('.layer').forEach(e=>e.classList.toggle('on',e.id==='L-'+lay));document.getElementById('ixt').textContent=D[lay];}
  document.getElementById('panel').innerHTML=FICHAS[cur][i][1];
  store('relieve-tab',i);
  document.querySelectorAll('#panel .quiz').forEach(renderQuiz);
}
function renderQuiz(box){
  const qs=QUIZ[box.dataset.k]; let html='<h4>Preguntas</h4>';
  qs.forEach((q,i)=>{html+='<div class="qq" data-i="'+i+'"><p class="qt">'+(i+1)+'. '+q.q+'</p><div class="qo">'+q.o.map((o,j)=>'<button data-j="'+j+'">'+o+'</button>').join('')+'</div><p class="qe"></p></div>';});
  html+='<p class="score qscore"></p><div class="exbtns"><button class="qreset">Reiniciar preguntas</button></div>';
  box.innerHTML=html;
  const upd=()=>{const done=box.querySelectorAll('.qq.done').length,ok=box.querySelectorAll('.qq.right').length;box.querySelector('.qscore').textContent=done?('Aciertos: '+ok+' de '+done+(done<qs.length?' (te quedan '+(qs.length-done)+')':'')):'';};
  box.querySelectorAll('.qq').forEach(d=>{const q=qs[+d.dataset.i];d.querySelectorAll('.qo button').forEach(b=>b.onclick=()=>{
    if(d.classList.contains('done'))return; const j=+b.dataset.j; d.classList.add('done');
    d.querySelectorAll('.qo button')[q.a].classList.add('qok'); if(j!==q.a){b.classList.add('qko');}else{d.classList.add('right');}
    d.querySelector('.qe').innerHTML=(j===q.a?'<b class="ok">Correcto.</b> ':'<b class="ko">No es esa.</b> ')+q.e; upd();});});
  box.querySelector('.qreset').onclick=()=>renderQuiz(box);
}
document.querySelectorAll('button[data-l]').forEach(b=>b.addEventListener('click',()=>{show(b.dataset.l,0);}));
document.getElementById('panel').addEventListener('click',e=>{
  if(e.target.tagName==='IMG'){document.getElementById('lbimg').src=e.target.src;document.getElementById('lbcap').textContent=e.target.dataset.cap||'';document.getElementById('lb').classList.add('on');}
});
document.getElementById('lb').addEventListener('click',()=>document.getElementById('lb').classList.remove('on'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb').classList.remove('on');});
const st=document.getElementById('srcToggle');
function setSrc(on){document.body.classList.toggle('src',on);st.checked=on;store('relieve-src',on?'1':'0');}
st.addEventListener('change',()=>setSrc(st.checked));
if(load('relieve-src')==='0')setSrc(false);
function checkEx(id){
  const ex=document.getElementById(id);let ok=0,n=0,empty=0;
  ex.querySelectorAll('.qrow').forEach(r=>{const s=r.querySelector('select'),m=r.querySelector('.qr');n++;
    if(!s.value){empty++;m.textContent='';m.className='qr';return;}
    if(s.value===s.dataset.q){ok++;m.textContent='✓';m.className='qr ok';}else{m.textContent='✗';m.className='qr ko';}});
  ex.querySelector('.score').textContent=empty?('Te faltan '+empty+' por responder. Aciertos: '+ok+' de '+n):('Aciertos: '+ok+' de '+n);
}
function resetEx(id){const ex=document.getElementById(id);ex.querySelectorAll('select').forEach(s=>s.value='');ex.querySelectorAll('.qr').forEach(m=>{m.textContent='';m.className='qr';});ex.querySelector('.score').textContent='';}
let start=load('relieve-sel');if(!start||!FICHAS[start])start='aclinal';
show(start,parseInt(load('relieve-tab')||'0',10));
</script>
</body>
