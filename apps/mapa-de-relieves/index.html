 alpina<\/b> en el fondo de las cuencas. Son capas <b>horizontales<\/b>, sin plegar.<\/p><p><span class=\"s-pps\">Rocas sedimentarias continentales poco resistentes, depositadas a finales del Cenozoico y en el Cuaternario.<\/span><\/p><p>Se erosionan con facilidad: con el agua forman una masa pastosa que la corriente arrastra.<\/p><p><span class=\"s-pps\">Es un relieve de <b>erosión diferencial<\/b>: con estratos horizontales da mesas, páramos y cerros testigo; con estratos inclinados, cuestas.<\/span> <span class=\"s-yo\">Por eso aquí aparecen también los relieves aclinal y monoclinal.<\/span><\/p><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/099.webp\" alt=\"Modelado arcilloso\" loading=\"lazy\" data-cap=\"Modelado arcilloso\"><figcaption><span class=\"tag t-P\">PPS<\/span>Modelado arcilloso<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/008.webp\" alt=\"Relieves horizontales o tabulares\" loading=\"lazy\" data-cap=\"Relieves horizontales o tabulares\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieves horizontales o tabulares<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/012.webp\" alt=\"Relieve en cuesta: dorso y frente\" loading=\"lazy\" data-cap=\"Relieve en cuesta: dorso y frente\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve en cuesta: dorso y frente<\/figcaption><\/figure><\/div>"], ["Formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Campiñas<\/div><div class=\"td\">Relieve suavemente ondulado de rocas blandas.<\/div><\/div><div class=\"term\"><div class=\"tn\">Cárcavas<\/div><div class=\"td\">Surcos estrechos y profundos separados por aristas, en clima semiárido con lluvias torrenciales y sin vegetación.<\/div><\/div><div class=\"term\"><div class=\"tn\">Badlands<\/div><div class=\"td\">Paisaje de cárcavas que ocupa una zona amplia.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-Y\"><img src=\"img/100.webp\" alt=\"Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)\" loading=\"lazy\" data-cap=\"Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/101.webp\" alt=\"Cárcavas: badland del Desierto de Tabernas (Almería)\" loading=\"lazy\" data-cap=\"Cárcavas: badland del Desierto de Tabernas (Almería)\"><figcaption><span class=\"tag t-P\">PPS<\/span>Cárcavas: badland del Desierto de Tabernas (Almería)<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-Y\"><img src=\"img/100.webp\" alt=\"Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)\" loading=\"lazy\" data-cap=\"Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Campiña Sur cordobesa: llanura suavemente ondulada y cultivada. Foto: Salvatorecoco, Wikimedia Commons (CC BY 3.0)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/099.webp\" alt=\"Modelado arcilloso\" loading=\"lazy\" data-cap=\"Modelado arcilloso\"><figcaption><span class=\"tag t-P\">PPS<\/span>Modelado arcilloso<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/102.webp\" alt=\"Cárcavas del Desierto de Tabernas (Almería)\" loading=\"lazy\" data-cap=\"Cárcavas del Desierto de Tabernas (Almería)\"><figcaption><span class=\"tag t-P\">PPS<\/span>Cárcavas del Desierto de Tabernas (Almería)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/007.webp\" alt=\"Hoya de Huesca\" loading=\"lazy\" data-cap=\"Hoya de Huesca\"><figcaption><span class=\"tag t-P\">PPS<\/span>Hoya de Huesca<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/014.webp\" alt=\"Relieve en cuesta\" loading=\"lazy\" data-cap=\"Relieve en cuesta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve en cuesta<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/015.webp\" alt=\"Relieve en cuesta\" loading=\"lazy\" data-cap=\"Relieve en cuesta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve en cuesta<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/008.webp\" alt=\"Relieves horizontales o tabulares\" loading=\"lazy\" data-cap=\"Relieves horizontales o tabulares\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieves horizontales o tabulares<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\">Submesetas norte y sur, depresiones del <b>Ebro<\/b> y del <b>Guadalquivir<\/b>, valles interiores y llanuras costeras. Cárcavas en el <b>sureste<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Valles fluviales, depresiones del Ebro y del Guadalquivir y llanuras costeras mediterráneas. Badland del <b>Desierto de Tabernas<\/b> (Almería).<\/span><\/div><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"arcilloso\"><\/div>"]], "volcanico": [["Qué es", "<p>Relieve de rocas <b>magmáticas<\/b> de sucesivas erupciones, muy resistente a la erosión. <span class=\"s-pps\">Se debe a la erupción de los volcanes y a la erosión posterior.<\/span><\/p><p><span class=\"s-pdf\">Un <b>volcán<\/b> es un edificio formado por la acumulación de productos sólidos alrededor de un <b>cráter<\/b>. El magma está en la <b>cámara magmática<\/b> y sube por la <b>chimenea<\/b>.<\/span><\/p><p>Materiales: cenizas, lapilli, escorias y bombas volcánicas. <span class=\"s-pdf\">También lavas y gases (<b>fumarolas<\/b>).<\/span><\/p><p><span class=\"s-pps\">Rocas ígneas: si el magma se solidifica dentro son <b>plutónicas<\/b>; si se enfría en superficie, <b>volcánicas<\/b> (obsidiana, piedra pómez, basalto).<\/span><\/p><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/103.webp\" alt=\"Corte de un volcán\" loading=\"lazy\" data-cap=\"Corte de un volcán\"><figcaption><span class=\"tag t-F\">PDF<\/span>Corte de un volcán<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/104.webp\" alt=\"Trapps, caldera, colada, cráter y chimenea\" loading=\"lazy\" data-cap=\"Trapps, caldera, colada, cráter y chimenea\"><figcaption><span class=\"tag t-F\">PDF<\/span>Trapps, caldera, colada, cráter y chimenea<\/figcaption><\/figure><\/div>"], ["Partes y formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Cono<\/div><div class=\"td\"><span class=\"s-pps\">Cono truncado alrededor del cráter.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Caldera<\/div><div class=\"td\">Depresión circular. <span class=\"s-pdf\">Gran depresión formada cuando las explosiones destruyen la parte central o se hunde el techo de la cámara magmática.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Colada<\/div><div class=\"td\">Manto de lava que baja por la ladera. <span class=\"s-pdf\">Sus características dependen del magma, su temperatura, sus gases y el relieve.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Plataformas basálticas / trapps<\/div><div class=\"td\">Oscuras, cubren grandes áreas. <span class=\"s-pdf\">Mesetas de escasa pendiente con escarpes escalonados.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Domo de lava<\/div><div class=\"td\"><span class=\"s-pdf\">Montículo de lava lenta que se amontona sobre la boca.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Malpaís<\/div><div class=\"td\">Zona de coladas solidificadas. <span class=\"s-pps\">Como una escombrera de lava.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Roques y diques<\/div><div class=\"td\">Masas de lava de la chimenea que la erosión deja al descubierto.<\/div><\/div><div class=\"term\"><div class=\"tn\">Pitones<\/div><div class=\"td\"><span class=\"s-yo\">Restos de chimeneas en resalte.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/105.webp\" alt=\"Formación de una caldera\" loading=\"lazy\" data-cap=\"Formación de una caldera\"><figcaption><span class=\"tag t-F\">PDF<\/span>Formación de una caldera<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/106.webp\" alt=\"Elementos del paisaje volcánico\" loading=\"lazy\" data-cap=\"Elementos del paisaje volcánico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Elementos del paisaje volcánico<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/107.webp\" alt=\"Formas del relieve volcánico canario\" loading=\"lazy\" data-cap=\"Formas del relieve volcánico canario\"><figcaption><span class=\"tag t-P\">PPS<\/span>Formas del relieve volcánico canario<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/108.webp\" alt=\"Caldera (Galápagos)\" loading=\"lazy\" data-cap=\"Caldera (Galápagos)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Caldera (Galápagos)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/109.webp\" alt=\"Domo de lava en una caldera\" loading=\"lazy\" data-cap=\"Domo de lava en una caldera\"><figcaption><span class=\"tag t-F\">PDF<\/span>Domo de lava en una caldera<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/110.webp\" alt=\"Coladas de lava\" loading=\"lazy\" data-cap=\"Coladas de lava\"><figcaption><span class=\"tag t-F\">PDF<\/span>Coladas de lava<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/111.webp\" alt=\"Colada activa\" loading=\"lazy\" data-cap=\"Colada activa\"><figcaption><span class=\"tag t-F\">PDF<\/span>Colada activa<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/112.webp\" alt=\"Trapps\" loading=\"lazy\" data-cap=\"Trapps\"><figcaption><span class=\"tag t-F\">PDF<\/span>Trapps<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/113.webp\" alt=\"Caldera de Taburiente y Roque de los Muchachos\" loading=\"lazy\" data-cap=\"Caldera de Taburiente y Roque de los Muchachos\"><figcaption><span class=\"tag t-P\">PPS<\/span>Caldera de Taburiente y Roque de los Muchachos<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/114.webp\" alt=\"Malpaís del Teide\" loading=\"lazy\" data-cap=\"Malpaís del Teide\"><figcaption><span class=\"tag t-P\">PPS<\/span>Malpaís del Teide<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/115.webp\" alt=\"Modelado volcánico\" loading=\"lazy\" data-cap=\"Modelado volcánico\"><figcaption><span class=\"tag t-P\">PPS<\/span>Modelado volcánico<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><b>Canarias<\/b>, <b>Campo de Calatrava<\/b> (Ciudad Real), <b>cabo de Gata<\/b> (Almería) y <b>La Garrotxa<\/b> (Girona).<\/div><div class=\"wi\"><span class=\"s-pps\">Volcanes de la orogenia alpina en Campo de Calatrava, <b>Olot-Ampurdán<\/b> y cabo de Gata. Canarias: Teide (3.718 m), Caldera de Taburiente, Roque de los Muchachos.<\/span><\/div><div class=\"wi\"><span class=\"s-yo\">Ojo con el PPS: rotula la Caldera de Taburiente en Gran Canaria y el Roque de los Muchachos en La Gomera, pero <b>los dos están en La Palma<\/b>. Además, da dos orígenes distintos para Canarias; es un tema debatido.<\/span><\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del paisaje volcánico.<\/p><div class=\"ex\" id=\"ex4\"><div class=\"exgrid\"><div><figure class=\"fig src-A\"><img src=\"img/116.webp\" alt=\"Elementos del paisaje volcánico\" loading=\"lazy\" data-cap=\"Elementos del paisaje volcánico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Elementos del paisaje volcánico<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Caldera\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Roques\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Chimenea\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Colada de lava\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">5<\/span><select data-q=\"Cono\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">6<\/span><select data-q=\"Malpaís\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">7<\/span><select data-q=\"Dique\"><option value=\"\">Elige…<\/option><option>Caldera<\/option><option>Chimenea<\/option><option>Colada de lava<\/option><option>Cono<\/option><option>Dique<\/option><option>Malpaís<\/option><option>Roques<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex4')\">Comprobar<\/button><button onclick=\"resetEx('ex4')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"volcanico\"><\/div>"]], "glaciar": [["Qué es", "<p>En los periodos fríos del Cuaternario el hielo cubrió las cumbres más altas. Hay dos tipos de glaciar:<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Glaciar de circo (pirenaico)<\/div><div class=\"td\">Solo tiene circo: el hielo se acumula en una hondonada y el hielo-deshielo agranda sus paredes. Al desaparecer deja lagos.<\/div><\/div><div class=\"term\"><div class=\"tn\">Glaciar de valle (alpino)<\/div><div class=\"td\">Circo, <b>lengua<\/b> y zona de ablación: el hielo baja por el valle y lo excava en forma de U.<\/div><\/div><\/div><p>El <b>periglaciarismo<\/b> (alternancia de hielo y deshielo) produce gelifracción y solifluxión.<\/p>"], ["Partes y formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Circo<\/div><div class=\"td\">Hondonada donde se acumula el hielo.<\/div><\/div><div class=\"term\"><div class=\"tn\">Lengua<\/div><div class=\"td\">Masa de hielo que baja por el valle.<\/div><\/div><div class=\"term\"><div class=\"tn\">Valle en U o artesa<\/div><div class=\"td\">Valle excavado por la lengua. <span class=\"s-pps\">Distinto del valle fluvial en V.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Morrenas<\/div><div class=\"td\">Acumulaciones de rocas en los lados (laterales), el centro o el frente; la frontal puede cerrar el valle y formar un lago.<\/div><\/div><div class=\"term\"><div class=\"tn\">Valle colgado<\/div><div class=\"td\"><span class=\"s-yo\">Valle de un afluente que queda más alto que el principal.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Lagos y lagunas<\/div><div class=\"td\">Ocupan los circos al desaparecer el hielo.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/117.webp\" alt=\"Circo, lengua, morrenas, valle colgado y valle en U\" loading=\"lazy\" data-cap=\"Circo, lengua, morrenas, valle colgado y valle en U\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Circo, lengua, morrenas, valle colgado y valle en U<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/118.webp\" alt=\"El relieve glaciar\" loading=\"lazy\" data-cap=\"El relieve glaciar\"><figcaption><span class=\"tag t-P\">PPS<\/span>El relieve glaciar<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/119.webp\" alt=\"Valles en V, en U y mixtos\" loading=\"lazy\" data-cap=\"Valles en V, en U y mixtos\"><figcaption><span class=\"tag t-P\">PPS<\/span>Valles en V, en U y mixtos<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/120.webp\" alt=\"Glaciar alpino\" loading=\"lazy\" data-cap=\"Glaciar alpino\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Glaciar alpino<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/121.webp\" alt=\"Glaciar pirenaico\" loading=\"lazy\" data-cap=\"Glaciar pirenaico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Glaciar pirenaico<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/122.webp\" alt=\"Glaciar pirenaico\" loading=\"lazy\" data-cap=\"Glaciar pirenaico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Glaciar pirenaico<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/123.webp\" alt=\"Valle glaciar en U\" loading=\"lazy\" data-cap=\"Valle glaciar en U\"><figcaption><span class=\"tag t-P\">PPS<\/span>Valle glaciar en U<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\">Hoy solo en las cumbres más altas del <b>Pirineo<\/b>. En el pasado, sobre todo Pirineos y, en menor medida, <b>Sierra Nevada<\/b>. Lagos: <b>Covadonga<\/b>, <b>Peñalara<\/b>, <b>Laguna Negra<\/b>, <b>Sanabria<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Glaciares de circo y de valle en <b>Picos de Europa<\/b>, <b>Pirineos<\/b>, <b>Montes de León<\/b>, <b>Sierra Nevada<\/b> y <b>Sistema Central<\/b>.<\/span><\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex12\"><div class=\"exgrid\"><div><figure class=\"fig src-A\"><img src=\"img/124.webp\" alt=\"Glaciar de valle y valle glaciar\" loading=\"lazy\" data-cap=\"Glaciar de valle y valle glaciar\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Glaciar de valle y valle glaciar<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Circo\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Lengua\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Morrena lateral\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Morrenas centrales\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">5<\/span><select data-q=\"Laguna\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">6<\/span><select data-q=\"Valle colgado\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">7<\/span><select data-q=\"Valle en U\"><option value=\"\">Elige…<\/option><option>Circo<\/option><option>Laguna<\/option><option>Lengua<\/option><option>Morrena lateral<\/option><option>Morrenas centrales<\/option><option>Valle colgado<\/option><option>Valle en U<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex12')\">Comprobar<\/button><button onclick=\"resetEx('ex12')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"glaciar\"><\/div>"]], "costa": [["Erosión fluvial", "<div class=\"split\"><div class=\"sl\"><p>El agua de los ríos desgasta, transporta y deposita. La erosión depende de la pendiente y del perfil del río.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Curso alto<\/div><div class=\"td\">Mucha pendiente: predomina la <b>erosión<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Curso medio<\/div><div class=\"td\">Predomina el <b>transporte<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Curso bajo<\/div><div class=\"td\">Poca pendiente: predomina la <b>sedimentación<\/b> (vega).<\/div><\/div><\/div><p>Transporte: en superficie por disolución y suspensión; en el fondo por arrastre y saltación.<\/p><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/125.webp\" alt=\"Curso de un río\" loading=\"lazy\" data-cap=\"Curso de un río\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Curso de un río<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Formas de erosión", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Valles fluviales<\/div><div class=\"td\">Depresiones excavadas por ríos y torrentes, delimitadas por dos laderas. En los cursos altos tienen perfil en <b>V<\/b>; si la roca es muy dura y van encajados entre paredes verticales forman <b>gargantas o cañones<\/b>. En los cursos medio y bajo se ensanchan y las laderas se suavizan. <span class=\"s-pps\">Ejemplo: valle en V de un río pirenaico.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cascadas y saltos de agua<\/div><div class=\"td\">Frecuentes en los cursos alto y medio, cuando el río salva un fuerte desnivel.<\/div><\/div><div class=\"term\"><div class=\"tn\">Meandros<\/div><div class=\"td\">Curvas pronunciadas del cauce en zonas de poca pendiente. En la orilla donde el agua va más rápido erosiona (lado abrupto) y en la otra deposita (lado suave). Con las crecidas, el río puede abrirse paso en línea recta y dejar un <b>meandro abandonado<\/b>.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/126.webp\" alt=\"Valle fluvial en V (río pirenaico)\" loading=\"lazy\" data-cap=\"Valle fluvial en V (río pirenaico)\"><figcaption><span class=\"tag t-P\">PPS<\/span>Valle fluvial en V (río pirenaico)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/119.webp\" alt=\"Valles en V, en U y mixtos\" loading=\"lazy\" data-cap=\"Valles en V, en U y mixtos\"><figcaption><span class=\"tag t-P\">PPS<\/span>Valles en V, en U y mixtos<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Formas de acumulación", "<div class=\"split\"><div class=\"sl\"><p>Los materiales que deposita el río se llaman <b>aluviones<\/b>.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Llanuras aluviales o de inundación (vegas)<\/div><div class=\"td\">En los cursos medio y bajo, con poca pendiente, el río pierde fuerza y deposita: valles amplios de fondo plano.<\/div><\/div><div class=\"term\"><div class=\"tn\">Terrazas fluviales<\/div><div class=\"td\">Plataformas a los lados del cauce que se forman cuando el río se encaja en su llanura. Se deben a la alternancia climática del Cuaternario: en los periodos glaciares el río deposita; en los interglaciares, con más caudal, excava. <span class=\"s-pps\">El proceso se repite y deja varios niveles escalonados, como en los Arribes del Duero.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Rambla<\/div><div class=\"td\">Cauce de caudal ocasional, corto y de fuerte pendiente: erosiona en una parte y deposita arena y sedimentos en otra.<\/div><\/div><div class=\"term\"><div class=\"tn\">Delta<\/div><div class=\"td\">En la desembocadura, los aluviones forman un saliente triangular en el mar. Se forma donde las corrientes marinas son débiles. <span class=\"s-pps\">Ejemplo: delta del Ebro.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Estuario<\/div><div class=\"td\">Lo contrario del delta: desembocadura en forma de embudo en mares agitados, donde se mezclan agua dulce y salada.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/127.webp\" alt=\"Formación de terrazas fluviales\" loading=\"lazy\" data-cap=\"Formación de terrazas fluviales\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Formación de terrazas fluviales<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/128.webp\" alt=\"Terrazas fluviales\" loading=\"lazy\" data-cap=\"Terrazas fluviales\"><figcaption><span class=\"tag t-P\">PPS<\/span>Terrazas fluviales<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/129.webp\" alt=\"Delta del Ebro\" loading=\"lazy\" data-cap=\"Delta del Ebro\"><figcaption><span class=\"tag t-P\">PPS<\/span>Delta del Ebro<\/figcaption><\/figure><\/div><\/div><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><span class=\"s-pps\">Terrazas en el <b>Duero<\/b>, <b>Tajo<\/b>, <b>Guadiana<\/b>, <b>Guadalquivir<\/b> y <b>Ebro<\/b>; por ejemplo en los <b>Arribes del Duero<\/b>.<\/span><\/div><div class=\"wi\"><span class=\"s-pps\"><b>Delta del Ebro<\/b>.<\/span><\/div><\/div><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/130.webp\" alt=\"Terrazas fluviales en los Arribes del Duero\" loading=\"lazy\" data-cap=\"Terrazas fluviales en los Arribes del Duero\"><figcaption><span class=\"tag t-P\">PPS<\/span>Terrazas fluviales en los Arribes del Duero<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/129.webp\" alt=\"Delta del Ebro\" loading=\"lazy\" data-cap=\"Delta del Ebro\"><figcaption><span class=\"tag t-P\">PPS<\/span>Delta del Ebro<\/figcaption><\/figure><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex13\"><div class=\"exgrid\"><div><figure class=\"fig src-A\"><img src=\"img/131.webp\" alt=\"Curso de un río\" loading=\"lazy\" data-cap=\"Curso de un río\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Curso de un río<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Cabecera\"><option value=\"\">Elige…<\/option><option>Afluente<\/option><option>Cabecera<\/option><option>Cascadas<\/option><option>Curso alto<\/o istema Ibérico<\/option><option>Sistemas Béticos<\/option><option>Submeseta norte<\/option><option>Submeseta sur<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex14')\">Comprobar<\/button><button onclick=\"resetEx('ex14')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"unidades\"><\/div>"]], "litologia": [["Mapa", "<p>El mapa de arriba muestra ahora los dominios litológicos.<\/p><div class=\"legend\"><span><i style=\"background:#7BB043\"><\/i>Silícea<\/span><span><i style=\"background:#D9443A\"><\/i>Caliza<\/span><span><i style=\"background:#EBD94A\"><\/i>Arcillosa<\/span><span><i style=\"background:#5B3E96\"><\/i>Volcánica<\/span><\/div><div class=\"gal\"><figure class=\"fig src-P big\"><img src=\"img/139.webp\" alt=\"Litología de la península Ibérica\" loading=\"lazy\" data-cap=\"Litología de la península Ibérica\"><figcaption><span class=\"tag t-P\">PPS<\/span>Litología de la península Ibérica<\/figcaption><\/figure><\/div>"], ["Dominios", "<div class=\"split\"><div class=\"sl\"><p><span class=\"s-pps\">La litología depende de la evolución geológica. Según su antigüedad hay tres áreas, cada una con su modelado:<\/span><\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Silícea<\/div><div class=\"td\"><span class=\"s-pps\">Rocas más antiguas: granito, pizarra, cuarcita, gneis. Oeste peninsular.<\/span> → ficha <b>Silíceo<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Caliza<\/div><div class=\"td\"><span class=\"s-pps\">Calizas del Mesozoico plegadas en la alpina. Z invertida.<\/span> → ficha <b>Kárstico<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Arcillosa<\/div><div class=\"td\"><span class=\"s-pps\">Sedimentos blandos recientes. Depresiones y valles.<\/span> → ficha <b>Arcilloso<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Volcánica<\/div><div class=\"td\"><span class=\"s-pps\">Canarias y algunos puntos peninsulares.<\/span> → ficha <b>Volcánico<\/b>.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/140.webp\" alt=\"El modelado según la litología\" loading=\"lazy\" data-cap=\"El modelado según la litología\"><figcaption><span class=\"tag t-P\">PPS<\/span>El modelado según la litología<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Rocas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Magmáticas o ígneas<\/div><div class=\"td\">Del enfriamiento del magma: en profundidad, plutónicas (granito); en superficie, volcánicas (basalto).<\/div><\/div><div class=\"term\"><div class=\"tn\">Sedimentarias<\/div><div class=\"td\">Materiales erosionados, transportados y depositados en capas; pueden tener fósiles. Calizas y yesos.<\/div><\/div><div class=\"term\"><div class=\"tn\">Metamórficas<\/div><div class=\"td\">Roca transformada por otra presión o temperatura: mármol, pizarra, gneis, cuarcita.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/141.webp\" alt=\"Tipos de rocas\" loading=\"lazy\" data-cap=\"Tipos de rocas\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Tipos de rocas<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"litologia\"><\/div>"]], "paleozoico": [["Qué ocurre", "<p><b>Era Primaria<\/b> (desde hace 570 m.a.). Compresión: a finales, la <b>orogénesis herciniana<\/b> pliega los sedimentos y surgen las cordilleras hercinianas y la futura <b>Meseta<\/b>.<\/p><p><span class=\"s-pps\"><b>600–225 m.a.<\/b> La orogenia caledoniana eleva el zócalo y lo inclina al este (<b>Protomeseta<\/b>). En el Carbonífero, la herciniana forma tres macizos: Galaico-Duriense, Catalano-Balear y del Ebro, y Bético-Rifeño.<\/span><\/p>"], ["Mapa", "<div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/142.webp\" alt=\"Era Primaria: el Macizo Ibérico\" loading=\"lazy\" data-cap=\"Era Primaria: el Macizo Ibérico\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Era Primaria: el Macizo Ibérico<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/143.webp\" alt=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\" loading=\"lazy\" data-cap=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Comparación: Era Primaria, Secundaria, Terciaria y actualidad<\/figcaption><\/figure><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"paleozoico\"><\/div>"]], "mesozoico": [["Qué ocurre", "<p><b>Era Secundaria<\/b> (desde hace 230 m.a.). <b>Calma orogénica<\/b>: las cordilleras hercinianas se erosionan y los sedimentos se depositan en las fosas pirenaica y bética.<\/p><p><span class=\"s-pps\"><b>225–68 m.a.<\/b> Transgresiones y regresiones marinas; se rellenan de sedimentos las zonas de las futuras cordilleras alpinas.<\/span><\/p>"], ["Mapa", "<div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/144.webp\" alt=\"Era Secundaria: el mar de Tethis\" loading=\"lazy\" data-cap=\"Era Secundaria: el mar de Tethis\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Era Secundaria: el mar de Tethis<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/143.webp\" alt=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\" loading=\"lazy\" data-cap=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Comparación: Era Primaria, Secundaria, Terciaria y actualidad<\/figcaption><\/figure><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"mesozoico\"><\/div>"]], "cenozoico": [["Qué ocurre", "<p><b>Era Terciaria<\/b> (desde hace 68 m.a.). <b>Orogénesis alpina<\/b>: cordilleras alpinas, pliegues de cobertera, depresiones prealpinas y fractura del zócalo de la Meseta.<\/p><ul><li><span class=\"s-pps\">Se elevan los <b>Pirineos<\/b> y los <b>Béticos<\/b> (relieve jurásico).<\/span><\/li><li><span class=\"s-pps\">Se forman las depresiones del <b>Ebro<\/b> (un mar interior que se deseca) y del <b>Guadalquivir<\/b> (un golfo marino).<\/span><\/li><li><span class=\"s-pps\">La Meseta se inclina al oeste: sus bordes se arrugan en relieve <b>sajónico<\/b> y su interior se fractura en relieve <b>germánico<\/b>.<\/span><\/li><li><span class=\"s-pps\">Volcanes en Campo de Calatrava, Olot-Ampurdán y cabo de Gata. Surgen las Canarias.<\/span><\/li><\/ul>"], ["Mapa", "<div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/145.webp\" alt=\"Era Terciaria: cordilleras y depresiones actuales\" loading=\"lazy\" data-cap=\"Era Terciaria: cordilleras y depresiones actuales\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Era Terciaria: cordilleras y depresiones actuales<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/143.webp\" alt=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\" loading=\"lazy\" data-cap=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Comparación: Era Primaria, Secundaria, Terciaria y actualidad<\/figcaption><\/figure><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"cenozoico\"><\/div>"]], "cuaternario": [["Qué ocurre", "<p>Desde hace 1,7 m.a. <b>Calma orogénica<\/b>: predominan la erosión y la sedimentación. Glaciarismo, periglaciarismo, ríos y viento.<\/p><p><span class=\"s-pps\">Alternan <b>periodos glaciares<\/b> (glaciares en Picos de Europa, Pirineos, Montes de León, Sierra Nevada y Sistema Central) e <b>interglaciares<\/b> (terrazas fluviales y cuencas sedimentarias).<\/span><\/p>"], ["Mapa", "<div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/146.webp\" alt=\"En la actualidad\" loading=\"lazy\" data-cap=\"En la actualidad\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>En la actualidad<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/143.webp\" alt=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\" loading=\"lazy\" data-cap=\"Comparación: Era Primaria, Secundaria, Terciaria y actualidad\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Comparación: Era Primaria, Secundaria, Terciaria y actualidad<\/figcaption><\/figure><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"cuaternario\"><\/div>"]], "meteorizacion": [["Qué es", "<div class=\"split\"><div class=\"sl\"><p>La erosión actúa sobre el roquedo modelándolo según su estructura litológica. Este proceso se llama <b>meteorización<\/b> y depende de dos factores: el <b>clima<\/b> y la <b>naturaleza de las rocas<\/b>.<\/p><p>Puede ser <b>mecánica o física<\/b> (cambios de temperatura, agua, actividad biológica) o <b>química<\/b> (disolución, hidratación, oxidación). Origina fragmentos que los agentes externos transportan y sedimentan.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Meteorización<\/div><div class=\"td\"><span class=\"s-pps\">Altera la roca <b>sin transporte<\/b>: la roca se rompe o se transforma en el mismo sitio.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Erosión<\/div><div class=\"td\"><span class=\"s-pps\">Arranca los materiales y los <b>transporta<\/b> y <b>sedimenta<\/b> en otro lugar.<\/span><\/div><\/div><\/div><p><span class=\"s-yo\">Por eso la meteorización va en Roquedo (prepara la roca) y la erosión en su propio apartado (se lleva los materiales).<\/span><\/p><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/147.webp\" alt=\"Meteorización y erosión\" loading=\"lazy\" data-cap=\"Meteorización y erosión\"><figcaption><span class=\"tag t-P\">PPS<\/span>Meteorización y erosión<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Física", "<div class=\"split\"><div class=\"sl\"><p>Rompe la roca <b>sin cambiar su composición<\/b> química. La roca se fractura y eso facilita la erosión y el transporte.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Descompresión<\/div><div class=\"td\">Rocas formadas a gran profundidad se dilatan al llegar a la superficie, donde la presión es menor: aparecen grietas y losas horizontales.<\/div><\/div><div class=\"term\"><div class=\"tn\">Termoclastia<\/div><div class=\"td\">El contraste de temperatura día-noche dilata y contrae la roca hasta romperla. Frecuente con gran amplitud térmica, en el granito.<\/div><\/div><div class=\"term\"><div class=\"tn\">Gelifracción<\/div><div class=\"td\">El agua se congela en las grietas, aumenta de volumen y fragmenta la roca. En climas con alternancia hielo-deshielo, como la montaña.<\/div><\/div><div class=\"term\"><div class=\"tn\">Haloclastia<\/div><div class=\"td\">La sal cristaliza en las fisuras, aumenta de volumen y rompe la roca. En ambientes áridos.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U\"><img src=\"img/148.webp\" alt=\"Infografía: meteorización física\" loading=\"lazy\" data-cap=\"Infografía: meteorización física\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Infografía: meteorización física<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/149.webp\" alt=\"Haloclastia: alvéolos en una roca costera por la cristalización de la sal\" loading=\"lazy\" data-cap=\"Haloclastia: alvéolos en una roca costera por la cristalización de la sal\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Haloclastia: alvéolos en una roca costera por la cristalización de la sal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/067.webp\" alt=\"Canchal: fragmentos arrancados por gelifracción\" loading=\"lazy\" data-cap=\"Canchal: fragmentos arrancados por gelifracción\"><figcaption><span class=\"tag t-F\">PDF<\/span>Canchal: fragmentos arrancados por gelifracción<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/063.webp\" alt=\"Agujas formadas por gelifracción\" loading=\"lazy\" data-cap=\"Agujas formadas por gelifracción\"><figcaption><span class=\"tag t-F\">PDF<\/span>Agujas formadas por gelifracción<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/068.webp\" alt=\"Lanchares: losas de granito (descompresión)\" loading=\"lazy\" data-cap=\"Lanchares: losas de granito (descompresión)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Lanchares: losas de granito (descompresión)<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Química", "<div class=\"split\"><div class=\"sl\"><p><b>Transforma<\/b> la roca: pierde cohesión y se altera.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Oxidación<\/div><div class=\"td\">Reacción de algunos minerales con el oxígeno del aire; se forman minerales nuevos.<\/div><\/div><div class=\"term\"><div class=\"tn\">Disolución<\/div><div class=\"td\">En minerales solubles (cloruros, nitratos), rocas calcáreas y el modelado kárstico.<\/div><\/div><div class=\"term\"><div class=\"tn\">Hidratación<\/div><div class=\"td\">El agua entra en la estructura de algunos minerales y aumentan de volumen, como el yeso.<\/div><\/div><div class=\"term\"><div class=\"tn\">Hidrólisis<\/div><div class=\"td\">Los iones H⁺ y OH⁻ del agua rompen minerales como el feldespato, que se transforma en arcilla. El granito puede llegar a la caolinización.<\/div><\/div><div class=\"term\"><div class=\"tn\">Bioquímica<\/div><div class=\"td\">Ácidos orgánicos de la descomposición de restos vivos y acción de las plantas.<\/div><\/div><div class=\"term\"><div class=\"tn\">Laterización<\/div><div class=\"td\">Lavado de la roca madre en climas cálidos y lluviosos: queda una costra dura de hierro y aluminio (laterita). Suelos poco fértiles.<\/div><\/div><div class=\"term\"><div class=\"tn\">Biológica<\/div><div class=\"td\"><span class=\"s-pps\">Acción de los seres vivos.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U\"><img src=\"img/150.webp\" alt=\"Infografía: meteorización química\" loading=\"lazy\" data-cap=\"Infografía: meteorización química\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Infografía: meteorización química<\/figcaption><\/figure><figure class=\"fig src-U\"><img src=\"img/151.webp\" alt=\"Laterización: perfil rojo de laterita, rico en hierro y aluminio\" loading=\"lazy\" data-cap=\"Laterización: perfil rojo de laterita, rico en hierro y aluminio\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Laterización: perfil rojo de laterita, rico en hierro y aluminio<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/058.webp\" alt=\"Pilancones, formados por hidrólisis\" loading=\"lazy\" data-cap=\"Pilancones, formados por hidrólisis\"><figcaption><span class=\"tag t-F\">PDF<\/span>Pilancones, formados por hidrólisis<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/086.webp\" alt=\"Lapiaz, formado por disolución de la caliza\" loading=\"lazy\" data-cap=\"Lapiaz, formado por disolución de la caliza\"><figcaption><span class=\"tag t-F\">PDF<\/span>Lapiaz, formado por disolución de la caliza<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/060.webp\" alt=\"Taffoni, por la acción del agua sobre el granito\" loading=\"lazy\" data-cap=\"Taffoni, por la acción del agua sobre el granito\"><figcaption><span class=\"tag t-F\">PDF<\/span>Taffoni, por la acción del agua sobre el granito<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"meteorizacion\"><\/div>"]], "laminar": [["Qué es", "<p>Es la erosión provocada por las <b>precipitaciones<\/b>. Las gotas de lluvia sueltan partículas de tierra que el agua arrastra hacia arroyos y ríos.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Arroyamiento<\/div><div class=\"td\">El agua de lluvia forma pequeñas corrientes que discurren por las pendientes.<\/div><\/div><div class=\"term\"><div class=\"tn\">Conos y glacis<\/div><div class=\"td\">Los materiales arrastrados se acumulan al pie de las vertientes. El glacis es una especie de rampa inclinada.<\/div><\/div><div class=\"term\"><div class=\"tn\">Surcos y cárcavas<\/div><div class=\"td\">En terrenos sin vegetación y con rocas poco resistentes.<\/div><\/div><div class=\"term\"><div class=\"tn\">Pérdida de suelo<\/div><div class=\"td\">En los bosques arrastra el mantillo y deja al descubierto las raíces.<\/div><\/div><\/div><p>Del agua de arroyada nacen los torrentes y arroyos, y de ellos los ríos, que desgastan, arrastran y depositan materiales según la pendiente y la velocidad del agua.<\/p><p><span class=\"s-pps\">Agentes de la erosión: aguas continentales, aguas marinas, glaciares, viento, seres vivos y ser humano.<\/span><\/p>"], ["Repaso", "<div class=\"quiz\" data-k=\"laminar\"><\/div>"]], "eolica": [["Qué es", "<p>Es la erosión del <b>viento<\/b>, favorecida por la <b>falta de vegetación<\/b>. También la favorecen una topografía suave, los materiales sueltos de la meteorización, la escasa cubierta vegetal y la poca humedad.<\/p><p>El viento transporta las partículas por <b>arrastre<\/b>, <b>saltación<\/b> y <b>suspensión<\/b>, según su tamaño. El cuarzo es el mineral más abundante en la arena y resiste la meteorización química, la disolución y la abrasión; el barro, la arcilla y el limo se transportan con facilidad.<\/p>"], ["Formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Deflación<\/div><div class=\"td\">En espacios amplios, el viento levanta las partículas finas de barro, arcilla y limo y forma depresiones llamadas <b>hoyas<\/b>.<\/div><\/div><div class=\"term\"><div class=\"tn\">Abrasión<\/div><div class=\"td\">Los elementos cortantes que lleva el viento forman <b>orificios y acanaladuras<\/b> y rocas en forma de seta.<\/div><\/div><div class=\"term\"><div class=\"tn\">Dunas<\/div><div class=\"td\">Acumulaciones de arena creadas por el viento.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-Y\"><img src=\"img/152.webp\" alt=\"Hoya de deflación: hueco abierto por el viento en una duna (Lunan Bay, Escocia). Foto: Adrian Diack, Wikimedia Commons (CC BY-SA 2.0)\" loading=\"lazy\" data-cap=\"Hoya de deflación: hueco abierto por el viento en una duna (Lunan Bay, Escocia). Foto: Adrian Diack, Wikimedia Commons (CC BY-SA 2.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Hoya de deflación: hueco abierto por el viento en una duna (Lunan Bay, Escocia). Foto: Adrian Diack, Wikimedia Commons (CC BY-SA 2.0)<\/figcaption><\/figure><figure class=\"fig src-Y\"><img src=\"img/153.webp\" alt=\"Roca en forma de seta modelada por la abrasión del viento. Foto: Wikimedia Commons (dominio público)\" loading=\"lazy\" data-cap=\"Roca en forma de seta modelada por la abrasión del viento. Foto: Wikimedia Commons (dominio público)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Roca en forma de seta modelada por la abrasión del viento. Foto: Wikimedia Commons (dominio público)<\/figcaption><\/figure><figure class=\"fig src-Y\"><img src=\"img/154.webp\" alt=\"Dunas de Maspalomas (Gran Canaria). Foto: Himarerme, Wikimedia Commons (dominio público)\" loading=\"lazy\" data-cap=\"Dunas de Maspalomas (Gran Canaria). Foto: Himarerme, Wikimedia Commons (dominio público)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Dunas de Maspalomas (Gran Canaria). Foto: Himarerme, Wikimedia Commons (dominio público)<\/figcaption><\/figure><figure class=\"fig src-Y\"><img src=\"img/155.webp\" alt=\"Duna de Bolonia (Tarifa, Cádiz). Foto: Jl FilpoC, Wikimedia Commons (CC BY-SA 4.0)\" loading=\"lazy\" data-cap=\"Duna de Bolonia (Tarifa, Cádiz). Foto: Jl FilpoC, Wikimedia Commons (CC BY-SA 4.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Duna de Bolonia (Tarifa, Cádiz). Foto: Jl FilpoC, Wikimedia Commons (CC BY-SA 4.0)<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"eolica\"><\/div>"]], "cronologia": [["Escala", "<div class=\"split\"><div class=\"sl\"><p>La historia geológica se divide en <b>eras<\/b>, y estas en <b>periodos<\/b> y <b>épocas<\/b>. Según la escala:<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Precámbrico<\/div><div class=\"td\">De hace 4.600 a 570 millones de años.<\/div><\/div><div class=\"term\"><div class=\"tn\">Era Primaria o Paleozoica<\/div><div class=\"td\">De 570 a 230 m.a.<\/div><\/div><div class=\"term\"><div class=\"tn\">Era Secundaria o Mesozoica<\/div><div class=\"td\">De 230 a 65 m.a.<\/div><\/div><div class=\"term\"><div class=\"tn\">Era Terciaria<\/div><div class=\"td\">De 65 a 1,8 m.a.<\/div><\/div><div class=\"term\"><div class=\"tn\">Era Cuaternaria<\/div><div class=\"td\">Desde hace 1,8 m.a. hasta hoy.<\/div><\/div><\/div><p><span class=\"s-yo\">* Las fuentes no coinciden del todo en las fechas: tus apuntes dan 68 m.a. para el inicio del Terciario y 1,7 m.a. para el Cuaternario. Las diferencias son pequeñas; usa las de tu temario.<\/span><\/p><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/156.webp\" alt=\"Escala del tiempo geológico\" loading=\"lazy\" data-cap=\"Escala del tiempo geológico\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Escala del tiempo geológico<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Orogénesis", "<p>Una <b>orogénesis<\/b> es una etapa de <b>compresión<\/b> de las placas que levanta nuevas cordilleras. Entre una y otra hay largas etapas de <b>calma orogénica<\/b>, en las que domina la erosión.<\/p><div class=\"split\" style=\"margin-bottom:14px\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Cadomiense · Precámbrico<\/div><div class=\"td\"><span class=\"s-pps\">Hizo emerger el <b>zócalo hespérico<\/b> (pizarras y gneis del oeste peninsular). Después fue arrasado por la erosión y cubierto por los mares paleozoicos.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/157.webp\" alt=\"La Península en el Precámbrico\" loading=\"lazy\" data-cap=\"La Península en el Precámbrico\"><figcaption><span class=\"tag t-P\">PPS<\/span>La Península en el Precámbrico<\/figcaption><\/figure><\/div><\/div><\/div><div class=\"split\" style=\"margin-bottom:14px\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Caledoniana · Paleozoico (Ordovícico)<\/div><div class=\"td\"><span class=\"s-pps\">Elevó de nuevo el zócalo hespérico y lo inclinó hacia el este, formando la <b>Protomeseta<\/b>.<\/span> <span class=\"s-yo\">En la Península dejó pocas huellas.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/158.webp\" alt=\"La Península en el Paleozoico\" loading=\"lazy\" data-cap=\"La Península en el Paleozoico\"><figcaption><span class=\"tag t-P\">PPS<\/span>La Península en el Paleozoico<\/figcaption><\/figure><\/div><\/div><\/div><div class=\"split\" style=\"margin-bottom:14px\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Herciniana · Paleozoico (Carbonífero-Pérmico)<\/div><div class=\"td\">A finales de la Era Primaria pliega los sedimentos marinos: surgen las <b>cordilleras hercinianas<\/b> y la zona occidental, la futura <b>Meseta<\/b>. <span class=\"s-pps\">Forma tres macizos: Galaico-Duriense, Catalano-Balear y del Ebro, y Bético-Rifeño.<\/span> <span class=\"s-yo\">En la escala, los plegamientos hercinianos están hacia los 280 m.a.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/142.webp\" alt=\"Era Primaria: el Macizo Ibérico\" loading=\"lazy\" data-cap=\"Era Primaria: el Macizo Ibérico\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Era Primaria: el Macizo Ibérico<\/figcaption><\/figure><\/div><\/div><\/div><div class=\"split\" style=\"margin-bottom:14px\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Alpina · Terciario<\/div><div class=\"td\">Es la principal responsable del <b>relieve actual<\/b>: se pliegan los sedimentos de las fosas (Pirineos y Béticos) y del borde del macizo (Ibérico y Cantábrico), se forman las depresiones del Ebro y Guadalquivir y se fractura el zócalo de la Meseta. <span class=\"s-yo\">En la escala, los plegamientos alpinos van del Eoceno al Mioceno (unos 55 a 22,5 m.a.).<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U big\"><img src=\"img/145.webp\" alt=\"Era Terciaria: cordilleras y depresiones actuales\" loading=\"lazy\" data-cap=\"Era Terciaria: cordilleras y depresiones actuales\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Era Terciaria: cordilleras y depresiones actuales<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/052.webp\" alt=\"Relieves germánico, sajónico y jurásico de la orogenia alpina\" loading=\"lazy\" data-cap=\"Relieves germánico, sajónico y jurásico de la orogenia alpina\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieves germánico, sajónico y jurásico de la orogenia alpina<\/figcaption><\/figure><\/div><\/div><\/div><h4>La secuencia<\/h4><ol class=\"steps\"><li><span class=\"s-pps\"><b>Cadomiense<\/b>: emerge el zócalo.<\/span><\/li><li><span class=\"s-pps\"><b>Caledoniana<\/b>: se eleva e inclina (Protomeseta).<\/span><\/li><li><b>Herciniana<\/b>: cordilleras hercinianas y futura Meseta.<\/li><li><b>Calma de la Era Secundaria<\/b>: erosión y sedimentación en las fosas.<\/li><li><b>Alpina<\/b>: relieve actual.<\/li><li><b>Calma del Cuaternario<\/b>: glaciares y ríos modelan el relieve.<\/li><\/ol>"], ["Repaso", "<div class=\"quiz\" data-k=\"cronologia\"><\/div>"]], "marina": [["Formas de ablación", "<div class=\"split\"><div class=\"sl\"><p>Son el resultado de la acción <b>destructiva<\/b> del mar sobre el relieve costero.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Acantilados<\/div><div class=\"td\">Escarpe litoral de gran pendiente y altura. Se localiza en zonas montañosas, volcánicas o en afloramientos de rocas duras. Hay acantilados <b>vivos<\/b> (el mar sigue erosionándolos) y <b>muertos<\/b> (ya separados del mar por la acumulación de sus propios materiales).<\/div><\/div><div class=\"term\"><div class=\"tn\">Plataformas de abrasión<\/div><div class=\"td\">Al pie de los acantilados: rampas accidentadas por resaltes y acanaladuras, rematadas por una terraza de acumulación sobre la que se desarrolla una playa.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-Y\"><img src=\"img/159.webp\" alt=\"Acantilados y plataforma de abrasión (rasa mareal) entre Deba y Zumaia. Foto: Jörg Braukmann, Wikimedia Commons (CC BY-SA 4.0)\" loading=\"lazy\" data-cap=\"Acantilados y plataforma de abrasión (rasa mareal) entre Deba y Zumaia. Foto: Jörg Braukmann, Wikimedia Commons (CC BY-SA 4.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Acantilados y plataforma de abrasión (rasa mareal) entre Deba y Zumaia. Foto: Jörg Braukmann, Wikimedia Commons (CC BY-SA 4.0)<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Formas de acumulación", "<div class=\"split\"><div class=\"sl\"><p>Son producidas por la <b>sedimentación<\/b> marina.<\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Playa<\/div><div class=\"td\">Materiales detríticos (arenas, gravas, materiales sueltos) depositados por el mar. De pendiente suave y cubiertas en parte por las mareas.<\/div><\/div><div class=\"term\"><div class=\"tn\">Marisma<\/div><div class=\"td\">Acumulación litoral rica en arcillas y materia orgánica por los aportes de la erosión marina y fluvial. Se estancan las aguas continentales y se desarrollan turberas.<\/div><\/div><div class=\"term\"><div class=\"tn\">Arrecifes coralinos<\/div><div class=\"td\">Acumulación de esqueletos de animales que viven en colonias.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-Y\"><img src=\"img/160.webp\" alt=\"Playa de Bolonia (Tarifa, Cádiz). Foto: El Pantera, Wikimedia Commons (CC BY-SA 4.0)\" loading=\"lazy\" data-cap=\"Playa de Bolonia (Tarifa, Cádiz). Foto: El Pantera, Wikimedia Commons (CC BY-SA 4.0)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Playa de Bolonia (Tarifa, Cádiz). Foto: El Pantera, Wikimedia Commons (CC BY-SA 4.0)<\/figcaption><\/figure><figure class=\"fig src-Y\"><img src=\"img/161.webp\" alt=\"Marismas de Doñana. Foto: Dvazquezq, Wikimedia Commons (CC BY-SA 3.0 ES)\" loading=\"lazy\" data-cap=\"Marismas de Doñana. Foto: Dvazquezq, Wikimedia Commons (CC BY-SA 3.0 ES)\"><figcaption><span class=\"tag t-Y\">Claude<\/span>Marismas de Doñana. Foto: Dvazquezq, Wikimedia Commons (CC BY-SA 3.0 ES)<\/figcaption><\/figure><\/div><\/div><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><span class=\"s-yo\">Acantilados de la costa cantábrica y gallega, como los del flysch de Zumaia, con su plataforma de abrasión.<\/span><\/div><div class=\"wi\"><span class=\"s-yo\">Playas y marismas en el sur y el Mediterráneo, como las marismas de Doñana.<\/span><\/div><div class=\"wi\"><span class=\"s-yo\">Rías gallegas.<\/span><\/div><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"marina\"><\/div>"]]};
