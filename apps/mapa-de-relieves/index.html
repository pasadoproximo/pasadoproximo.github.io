<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de relieves de la Península Ibérica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#F6F1E7;--card:#FFFCF6;--land:#ECE3D3;--line:#DDD2BF;--line2:#A89A8B;--text:#2A221D;--muted:#6B5E53;--acc:#2F6690;--accbg:#DCE8F2;--halo:#FFFCF6;
--c1:#C2502A;--c2:#1D8A68;--c3:#2F78C4;--c4:#A0701F;--spdf:#2E7D32;--spps:#7B3FA0;--syo:#1F63B5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E1A17;--card:#28231F;--land:#332C26;--line:#463D35;--line2:#7A6D61;--text:#EFE8DD;--muted:#B5A898;--acc:#8DBBE3;--accbg:#22384A;--halo:#28231F;--c1:#E07A52;--c2:#4CC09A;--c3:#6EA8E8;--c4:#E0B060;--spdf:#7CCB7F;--spps:#C9A0E8;--syo:#8DBBE3}}
:root[data-theme="dark"]{--bg:#1E1A17;--card:#28231F;--land:#332C26;--line:#463D35;--line2:#7A6D61;--text:#EFE8DD;--muted:#B5A898;--acc:#8DBBE3;--accbg:#22384A;--halo:#28231F;--c1:#E07A52;--c2:#4CC09A;--c3:#6EA8E8;--c4:#E0B060;--spdf:#7CCB7F;--spps:#C9A0E8;--syo:#8DBBE3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Source Sans 3',Arial,sans-serif;line-height:1.55}
main{max-width:1060px;margin:0 auto;padding:26px 18px 60px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.15;margin:0 0 6px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.sub{color:var(--muted);margin:0;font-size:17px}
.srcbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.srcbar label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.srcbar .k{display:flex;align-items:center;gap:4px}
.srcbar .k i{width:12px;height:12px;border-radius:3px;display:inline-block}
body:not(.src) .srckeys{opacity:.4}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grp{margin-bottom:12px}.grp:last-child{margin-bottom:0}
.grp h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;margin:0 0 6px;font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:15px;background:transparent;color:var(--text);border:1px solid var(--line2);border-radius:999px;padding:5px 13px;cursor:pointer}
button:hover{background:var(--land)}
button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
button.primary{background:var(--acc);color:var(--card);border-color:var(--acc)}
#it{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:600;margin:2px 0 4px}
#ix{margin:0;font-size:17px}#ixl{color:var(--acc)}
svg{width:100%;height:auto;display:block}
.layer{opacity:0;transition:opacity .3s;pointer-events:none}
.layer.on{opacity:1}
.lb{font-size:12px;font-family:'Source Sans 3',Arial,sans-serif;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;fill:var(--text);fill-opacity:1;stroke-opacity:1;stroke-dasharray:none}
#ficha{margin-top:18px;scroll-margin-top:12px}
#ficha h3{font-family:'Fraunces',Georgia,serif;font-size:clamp(22px,3vw,28px);margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tabs button{border:none;border-radius:8px 8px 0 0;padding:7px 14px;margin-bottom:-2px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted)}
.tabs button.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc)}
.panel{font-size:17px}
.panel p{margin:0 0 12px}
.panel h4{margin:16px 0 8px;font-size:17px}
.panel ul,.panel ol{margin:0 0 12px;padding-left:22px}
.panel li{margin-bottom:4px}
.terms{display:grid;gap:8px;margin-bottom:16px}
.term{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;padding:10px 12px;background:var(--bg);border-radius:10px}
@media (max-width:620px){.term{grid-template-columns:minmax(0,1fr);gap:2px}}
.tn{font-weight:600}
.where{display:grid;gap:8px;margin-bottom:16px}
.wi{padding:10px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 10px 10px 0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:8px 0 6px}
.fig{margin:0;background:var(--bg);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.fig img{width:100%;height:190px;object-fit:contain;background:#fff;display:block;cursor:zoom-in}
.mleg{display:grid;gap:10px;font-size:16px}.mleg:empty{display:none}
.li{display:flex;align-items:flex-start;gap:10px}.li .sw{margin-top:7px}.ld{font-size:15px;color:var(--muted);line-height:1.45}
.sw{flex:none;display:inline-block;width:26px}
.sw-fill{height:16px;border-radius:3px;background:var(--sw);border:1px solid rgba(0,0,0,.15)}
.sw-line{height:7px;border-radius:4px;background:var(--sw)}
.sw-dash{height:6px;background:repeating-linear-gradient(90deg,var(--sw) 0 5px,transparent 5px 9px)}
.sw-dot{width:14px;height:14px;border-radius:50%;background:var(--sw);margin-left:6px;margin-right:6px}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.split .sr{position:sticky;top:12px}
.split .sr .gal{grid-template-columns:minmax(0,1fr);margin-top:0}
.split .sr .fig img{height:auto;max-height:380px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}.split .sr{position:static}}
.split .term{grid-template-columns:minmax(0,1fr);gap:2px}
.quiz{margin-top:8px}.qq{padding:12px 14px;background:var(--bg);border-radius:10px;margin-bottom:10px}
.qt{font-weight:600;margin:0 0 8px}.qo{display:flex;flex-wrap:wrap;gap:6px}.qo button{border-radius:10px;text-align:left}
.qq.done .qo button{cursor:default}.qo button.qok{border-color:var(--c2);background:rgba(29,138,104,.12);font-weight:600}.qo button.qko{border-color:var(--c1);background:rgba(194,80,42,.12)}
.qe{margin:8px 0 0;font-size:15px}.qe:empty{display:none}.qe .ok{color:var(--c2)}.qe .ko{color:var(--c1)}
.fig.big{grid-column:1/-1}.fig.big img{height:auto;max-height:560px}
.fig figcaption{font-size:14px;padding:7px 10px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-radius:4px;padding:1px 5px;margin-right:6px;color:#fff;background:var(--muted)}
body.src .t-F{background:var(--spdf)} body.src .t-P{background:var(--spps)} body.src .t-A{background:#6B5E53} body.src .t-Y{background:var(--syo)}
body:not(.src) .tag{display:none}
body.src .s-pdf{color:var(--spdf)} body.src .s-pps{color:var(--spps)} body.src .s-yo{color:var(--syo)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:12px;border-radius:3px;display:inline-block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
th{background:var(--bg)}
.steps{counter-reset:none}
.exgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.exgrid{grid-template-columns:minmax(0,1fr)}}
.exgrid .fig img{height:auto;max-height:420px}
.qrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qn{font-weight:600;min-width:26px;text-align:right}
.qn.wide{min-width:0;flex:1;text-align:left}
.qs.wide{max-width:640px}
select{font:inherit;font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--text);max-width:100%}
.qr{min-width:22px;font-weight:600}
.qr.ok{color:var(--c2)}.qr.ko{color:var(--c1)}
.exbtns{display:flex;gap:8px;margin-top:10px}
.score{font-weight:600;margin-top:8px}
.lightbox{position:fixed;inset:0;background:rgba(20,16,12,.88);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));z-index:10;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:85vh;background:#fff;border-radius:8px}
.lightbox p{color:#fff;margin:10px 0 0;text-align:center}
.note{font-size:13px;color:var(--muted);margin-top:16px}
</style>
</head>

<script>
const FICHAS={"aclinal": [["Qué es", "<p>Relieve <b>estructural<\/b> de las <b>cuencas sedimentarias<\/b>: estratos <b>horizontales<\/b>, sin actuación tectónica, que alternan rocas duras y blandas en un terreno llano.<\/p><p>Se debe a la <b>erosión diferencial<\/b>: los agentes erosivos desgastan más la roca blanda que la dura, que queda en resalte. <span class=\"s-pdf\">Sobre estas rocas la tectónica no ha actuado o lo ha hecho muy débilmente; la red hidrográfica y el resto de agentes de la erosión van dando lugar a formas de diferente extensión.<\/span><\/p><p><span class=\"s-pdf\">La forma más sencilla es la <b>superficie estructural<\/b>: una superficie llana formada por una capa resistente dentro de una serie sedimentaria subhorizontal. Se localiza en los <b>centros<\/b> de las cuencas sedimentarias recientes.<\/span><\/p><p>Si el estrato resistente está arriba se llama <b>superficie horizontal primitiva<\/b>; si aparece en estratos inferiores, tras eliminar la erosión los sedimentos que lo cubrían, <b>superficie estructural derivada<\/b>.<\/p>"], ["Partes y formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Plataforma estructural (mesa, páramo)<\/div><div class=\"td\">Superficie plana sobre el estrato duro. <span class=\"s-pdf\">Sus bordes son escarpes de erosión: una <b>cornisa<\/b> de roca resistente arriba y un <b>talud<\/b> de roca menos resistente en la base.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Valle en cornisa<\/div><div class=\"td\">Separa las plataformas. Arriba la <b>cornisa<\/b> (roca dura, fuerte pendiente) y abajo el <b>talud<\/b> (roca blanda, pendiente suave).<\/div><\/div><div class=\"term\"><div class=\"tn\">Cerro testigo<\/div><div class=\"td\">Resto aislado de la antigua plataforma. <span class=\"s-pdf\">La erosión sigue actuando sobre la plataforma y da formas cónicas rematadas por un resto del estrato duro.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Antecerro<\/div><div class=\"td\"><span class=\"s-pdf\">La erosión sigue actuando sobre el cerro testigo hasta que desaparece el estrato de roca dura: queda una forma cónica sin remate.<\/span> <span class=\"s-pps\">Si llegan a perder su estrato duro, se llaman antecerros.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Muela<\/div><div class=\"td\"><span class=\"s-yo\">Mesa pequeña: aún conserva una cima plana de roca dura. Si la erosión la sigue reduciendo, queda una forma cónica con solo un resto del estrato duro: el cerro testigo.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Campiña<\/div><div class=\"td\">Llanura suavemente ondulada.<\/div><\/div><\/div><p><span class=\"s-pdf\">Es el <b>tamaño<\/b> lo que diferencia los términos, de mayor a menor: superficie estructural, páramo, mesa, muela, cerro testigo y antecerro.<\/span><\/p><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/001.webp\" alt=\"Mesas o páramos (1), cerros testigo (2) y antecerros (3)\" loading=\"lazy\" data-cap=\"Mesas o páramos (1), cerros testigo (2) y antecerros (3)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Mesas o páramos (1), cerros testigo (2) y antecerros (3)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/002.webp\" alt=\"Formación de un cerro testigo y posteriores antecerros\" loading=\"lazy\" data-cap=\"Formación de un cerro testigo y posteriores antecerros\"><figcaption><span class=\"tag t-F\">PDF<\/span>Formación de un cerro testigo y posteriores antecerros<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/003.webp\" alt=\"Bloque del relieve aclinal\" loading=\"lazy\" data-cap=\"Bloque del relieve aclinal\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Bloque del relieve aclinal<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/004.webp\" alt=\"Mesa\" loading=\"lazy\" data-cap=\"Mesa\"><figcaption><span class=\"tag t-F\">PDF<\/span>Mesa<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/005.webp\" alt=\"Cerro testigo\" loading=\"lazy\" data-cap=\"Cerro testigo\"><figcaption><span class=\"tag t-F\">PDF<\/span>Cerro testigo<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/006.webp\" alt=\"Antecerro\" loading=\"lazy\" data-cap=\"Antecerro\"><figcaption><span class=\"tag t-F\">PDF<\/span>Antecerro<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/007.webp\" alt=\"Relieve horizontal o tabular (Hoya de Huesca) con cerro testigo\" loading=\"lazy\" data-cap=\"Relieve horizontal o tabular (Hoya de Huesca) con cerro testigo\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve horizontal o tabular (Hoya de Huesca) con cerro testigo<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/008.webp\" alt=\"Páramos, glacis, campiña y cerro testigo\" loading=\"lazy\" data-cap=\"Páramos, glacis, campiña y cerro testigo\"><figcaption><span class=\"tag t-P\">PPS<\/span>Páramos, glacis, campiña y cerro testigo<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/009.webp\" alt=\"Relieve horizontal o tabular\" loading=\"lazy\" data-cap=\"Relieve horizontal o tabular\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve horizontal o tabular<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/010.webp\" alt=\"Corte litológico de la Meseta\" loading=\"lazy\" data-cap=\"Corte litológico de la Meseta\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Corte litológico de la Meseta<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\">Depresiones sedimentarias de la <b>Meseta<\/b>, del <b>Ebro<\/b> y del <b>Guadalquivir<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Ríos meseteños y depresiones del Ebro y del Guadalquivir. Ejemplo: <b>Hoya de Huesca<\/b>.<\/span><\/div><div class=\"wi\"><span class=\"s-yo\">Ejemplos típicos: páramos de Castilla y León, La Mancha y la Alcarria.<\/span><\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex2\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/001.webp\" alt=\"Bloque diagrama de un relieve horizontal\" loading=\"lazy\" data-cap=\"Bloque diagrama de un relieve horizontal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Bloque diagrama de un relieve horizontal<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Mesas o páramos\"><option value=\"\">Elige…<\/option><option>Mesas o páramos<\/option><option>Cerros testigo<\/option><option>Antecerros<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Cerros testigo\"><option value=\"\">Elige…<\/option><option>Mesas o páramos<\/option><option>Cerros testigo<\/option><option>Antecerros<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Antecerros\"><option value=\"\">Elige…<\/option><option>Mesas o páramos<\/option><option>Cerros testigo<\/option><option>Antecerros<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex2')\">Comprobar<\/button><button onclick=\"resetEx('ex2')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"aclinal\"><\/div>"]], "monoclinal": [["Qué es", "<p>Relieve de estratos alternos duros y blandos con <b>buzamiento<\/b> (inclinación) por algún movimiento tectónico. Se forma en los <b>bordes<\/b> de las cuencas sedimentarias. El resultado es la <b>cuesta<\/b>.<\/p><p><span class=\"s-pdf\">Se debe a la posición que ocupan dentro de la serie sedimentaria (vertientes de las cuencas, adaptadas a las rocas subyacentes) o a la acción de la tectónica. Se conocen en todo el mundo con la palabra castellana <b>cuestas<\/b>.<\/span><\/p><p><span class=\"s-pdf\">Una cuesta tiene un <b>perfil disimétrico<\/b>, con dos partes bien diferenciadas: el frente y el dorso.<\/span><\/p>"], ["Partes y formas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Frente<\/div><div class=\"td\">De gran pendiente. Tiene dos partes: <span class=\"s-pdf\">la <b>cornisa<\/b>, sobre roca dura, con pendiente muy fuerte que depende de la resistencia de la roca y del buzamiento, y el <b>talud<\/b>, de menor pendiente.<\/span> <span class=\"s-pps\">La parte inferior es cóncava (capa blanda): allí la erosión es más rápida y la cuesta retrocede.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Dorso<\/div><div class=\"td\">De pendiente suave, sigue la inclinación de los estratos. <span class=\"s-pps\">Es el estrato duro que descansa sobre otro más blando.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cerros testigo y antecerros<\/div><div class=\"td\">La erosión fluvial hace retroceder la cuesta y deja restos de su antigua extensión. <span class=\"s-pdf\">Son formas testigo del retroceso de la cuesta, debidas a la erosión diferencial de la red fluvial.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Red hidrográfica<\/div><div class=\"td\">Depende del buzamiento: los afluentes se disponen paralelos a los frentes.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/011.webp\" alt=\"Cuesta: frente, dorso, cerros testigo y antecerro\" loading=\"lazy\" data-cap=\"Cuesta: frente, dorso, cerros testigo y antecerro\"><figcaption><span class=\"tag t-F\">PDF<\/span>Cuesta: frente, dorso, cerros testigo y antecerro<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/012.webp\" alt=\"Dorso y frente de una cuesta\" loading=\"lazy\" data-cap=\"Dorso y frente de una cuesta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Dorso y frente de una cuesta<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/013.webp\" alt=\"Relieve en cuesta (Sistema Ibérico, Teruel)\" loading=\"lazy\" data-cap=\"Relieve en cuesta (Sistema Ibérico, Teruel)\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve en cuesta (Sistema Ibérico, Teruel)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/014.webp\" alt=\"Relieve en cuesta\" loading=\"lazy\" data-cap=\"Relieve en cuesta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve en cuesta<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/015.webp\" alt=\"Relieve en cuesta\" loading=\"lazy\" data-cap=\"Relieve en cuesta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve en cuesta<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><b>Bordes de las cuencas sedimentarias<\/b>.<\/div><div class=\"wi\">Ejemplo de tus apuntes: <b>Teruel<\/b> (Sistema Ibérico).<\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex5\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/016.webp\" alt=\"Bloque de un relieve en cuesta\" loading=\"lazy\" data-cap=\"Bloque de un relieve en cuesta\"><figcaption><span class=\"tag t-F\">PDF<\/span>Bloque de un relieve en cuesta<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Frente\"><option value=\"\">Elige…<\/option><option>Antecerro<\/option><option>Cerro testigo<\/option><option>Dorso de la cuesta<\/option><option>Frente<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Dorso de la cuesta\"><option value=\"\">Elige…<\/option><option>Antecerro<\/option><option>Cerro testigo<\/option><option>Dorso de la cuesta<\/option><option>Frente<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Cerro testigo\"><option value=\"\">Elige…<\/option><option>Antecerro<\/option><option>Cerro testigo<\/option><option>Dorso de la cuesta<\/option><option>Frente<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Antecerro\"><option value=\"\">Elige…<\/option><option>Antecerro<\/option><option>Cerro testigo<\/option><option>Dorso de la cuesta<\/option><option>Frente<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex5')\">Comprobar<\/button><button onclick=\"resetEx('ex5')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"monoclinal\"><\/div>"]], "jurasico": [["Qué es", "<p>Se denominan también <b>relieves estructurales complejos<\/b>. Se presentan como una sucesión de pliegues: <b>anticlinales<\/b> si son convexos y <b>sinclinales<\/b> si son cóncavos.<\/p><p>Su formación depende de tres factores: la <b>tectónica<\/b> (elevación del pliegue, buzamiento y simetría de los flancos), la <b>litología<\/b> (resistencia de las rocas y su disposición) y la <b>erosión<\/b>.<\/p><p><span class=\"s-pdf\">En las coberteras sedimentarias, la forma más elemental es una sucesión de ondulaciones, siempre que exista un <b>nivel de despegue<\/b>. Los pliegues rara vez aparecen aislados: se agrupan en <b>anticlinorios<\/b> (conjunto convexo) y <b>sinclinorios<\/b> (conjunto cóncavo).<\/span><\/p><p><span class=\"s-pps\">Cada pliegue tiene dos <b>flancos<\/b> y una <b>charnela<\/b> (donde se produce la inflexión). Según el buzamiento hay pliegues <b>rectos<\/b>, <b>inclinados<\/b>, <b>en cofre<\/b> y <b>en rodilla<\/b>.<\/span><\/p><p>Según cuánto los haya modificado la erosión, el relieve plegado puede ser:<\/p><ul><li><b>Conforme u original<\/b>: pliegues casi intactos.<\/li><li><b>Derivado<\/b>: el típico <b>relieve jurásico<\/b>, con ruces, combes y cluses.<\/li><li><b>Invertido<\/b>: anticlinales vaciados y sinclinales colgados.<\/li><li><b>Apalachense<\/b>: cordillera antigua arrasada y vuelta a levantar.<\/li><\/ul><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/017.webp\" alt=\"Anticlinales y sinclinal\" loading=\"lazy\" data-cap=\"Anticlinales y sinclinal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Anticlinales y sinclinal<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/018.webp\" alt=\"Tipos de pliegues\" loading=\"lazy\" data-cap=\"Tipos de pliegues\"><figcaption><span class=\"tag t-P\">PPS<\/span>Tipos de pliegues<\/figcaption><\/figure><\/div>"], ["Conforme", "<div class=\"split\"><div class=\"sl\"><p>Anticlinales y sinclinales que la erosión aún <b>no ha modificado<\/b> (estructuras recientes o protegidas por un estrato resistente). <span class=\"s-pdf\">Son estructuras directas, originales o primitivas, y el relieve es <b>conforme<\/b> con la estructura.<\/span><\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Mont<\/div><div class=\"td\">Punto más elevado del anticlinal, sobre roca resistente. <span class=\"s-pdf\">Relieve elevado y alargado cuya cumbre corresponde a la charnela y cuyas laderas son los flancos del anticlinal.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Val<\/div><div class=\"td\">Depresión alargada del sinclinal. <span class=\"s-pdf\">Su fondo corresponde a las charnelas y sus vertientes a los flancos.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Ruz<\/div><div class=\"td\">Barranco que nace en lo alto del anticlinal (charnela). <span class=\"s-pdf\">Pequeñas entalladuras que bajan por los flancos de los anticlinales.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/019.webp\" alt=\"Mont y val\" loading=\"lazy\" data-cap=\"Mont y val\"><figcaption><span class=\"tag t-F\">PDF<\/span>Mont y val<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/020.webp\" alt=\"Formación de una ruz sobre el mont\" loading=\"lazy\" data-cap=\"Formación de una ruz sobre el mont\"><figcaption><span class=\"tag t-F\">PDF<\/span>Formación de una ruz sobre el mont<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Derivado (jurásico)", "<div class=\"split\"><div class=\"sl\"><p><b>El relieve jurásico<\/b> se produce en <b>cordilleras jóvenes fuertemente plegadas<\/b>, con estratos duros y blandos plegados por la tectónica en una sucesión de anticlinales y sinclinales.<\/p><p><span class=\"s-pps\">Es el estilo tectónico de la compresión sobre <b>rocas blandas<\/b>, que se pliegan; si son duras se fracturan (germánico).<\/span><\/p><p>La erosión actúa sobre las partes levantadas y aparecen formas menores (típicas del Jura). <span class=\"s-pdf\">La erosión es mayor o más prolongada, por lo que la topografía refleja a la vez formas estructurales y erosivas.<\/span><\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Chevrons<\/div><div class=\"td\">Sucesión de ruces: restos de las capas duras externas del anticlinal. <span class=\"s-pdf\">Restos de las capas externas que quedan entre varias ruces.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Combe<\/div><div class=\"td\">Valle en la charnela del anticlinal, paralelo a la cumbre; nace al unirse ruces. <span class=\"s-pdf\">Suele estar rodeada por dos <b>crestas<\/b> (crêts) de roca dura.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cluse<\/div><div class=\"td\">Corte transversal de un río, perpendicular a la cumbre. <span class=\"s-pdf\">Valles angostos transversales a la estructura, también llamados <b>hoces o foces<\/b>.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cresta (crêt)<\/div><div class=\"td\"><span class=\"s-pdf\">Resalte de roca dura que delimita la combe.<\/span><\/div><\/div><\/div><p><span class=\"s-pdf\">En resumen: <b>ruces, chevrons, cluses, crestas y combes<\/b> son las formas erosivas del relieve derivado.<\/span><\/p><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U\"><img src=\"img/021.webp\" alt=\"Chevrons: restos triangulares de las capas duras entre ruces\" loading=\"lazy\" data-cap=\"Chevrons: restos triangulares de las capas duras entre ruces\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Chevrons: restos triangulares de las capas duras entre ruces<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/022.webp\" alt=\"Formas derivadas: combe, cluse, mont, ruz, val, crêt\" loading=\"lazy\" data-cap=\"Formas derivadas: combe, cluse, mont, ruz, val, crêt\"><figcaption><span class=\"tag t-F\">PDF<\/span>Formas derivadas: combe, cluse, mont, ruz, val, crêt<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/023.webp\" alt=\"Cresta, combe, val, río, mont, chevron, cluse y ruz\" loading=\"lazy\" data-cap=\"Cresta, combe, val, río, mont, chevron, cluse y ruz\"><figcaption><span class=\"tag t-F\">PDF<\/span>Cresta, combe, val, río, mont, chevron, cluse y ruz<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/024.webp\" alt=\"Relieve jurásico\" loading=\"lazy\" data-cap=\"Relieve jurásico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve jurásico<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Invertido", "<div class=\"split\"><div class=\"sl\"><p>Tras una fuerte erosión, los anticlinales quedan <b>vaciados<\/b> y los sinclinales, protegidos por sus sedimentos, quedan <b>colgados<\/b> a mayor altura.<\/p><p><span class=\"s-pdf\">Las zonas topográficamente más altas coinciden con las tectónicamente más bajas, y al revés.<\/span><\/p><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Sinclinal colgado (exhumado)<\/div><div class=\"td\"><span class=\"s-pdf\">Sinclinal que queda más alto que los anticlinales próximos porque estos han sido desmantelados por la erosión.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Anticlinal vaciado o desventrado (valle anticlinal)<\/div><div class=\"td\">El anticlinal, más expuesto, se rebaja hasta formar un valle.<\/div><\/div><div class=\"term\"><div class=\"tn\">Cubeta colgada<\/div><div class=\"td\"><span class=\"s-pdf\">Sinclinal colgado cerrado, en forma de cubeta.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Anticlinal exhumado<\/div><div class=\"td\"><span class=\"s-pdf\">Aflora al erosionarse el valle anticlinal.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Relieve aplanado<\/div><div class=\"td\"><span class=\"s-pdf\">Fase final, cuando la erosión ha arrasado los pliegues.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/025.webp\" alt=\"Sinclinal colgado, cubeta colgada y valle anticlinal\" loading=\"lazy\" data-cap=\"Sinclinal colgado, cubeta colgada y valle anticlinal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Sinclinal colgado, cubeta colgada y valle anticlinal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/026.webp\" alt=\"Cluse, combes, anticlinal vaciado, sinclinal colgado y anticlinal exhumado\" loading=\"lazy\" data-cap=\"Cluse, combes, anticlinal vaciado, sinclinal colgado y anticlinal exhumado\"><figcaption><span class=\"tag t-F\">PDF<\/span>Cluse, combes, anticlinal vaciado, sinclinal colgado y anticlinal exhumado<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/027.webp\" alt=\"Relieve conforme, invertido y aplanado &lt;span class=&quot;s-yo&quot;&gt;&lt;br&gt;* El derivado es el paso entre conforme e invertido: sus formas (ruz, cluse, combe) aparecen dentro de la zona «conforme».&lt;/span&gt;\" loading=\"lazy\" data-cap=\"Relieve conforme, invertido y aplanado &lt;span class=&quot;s-yo&quot;&gt;&lt;br&gt;* El derivado es el paso entre conforme e invertido: sus formas (ruz, cluse, combe) aparecen dentro de la zona «conforme».&lt;/span&gt;\"><figcaption><span class=\"tag t-F\">PDF<\/span>Relieve conforme, invertido y aplanado <span class=\"s-yo\"><br>* El derivado es el paso entre conforme e invertido: sus formas (ruz, cluse, combe) aparecen dentro de la zona «conforme».<\/span><\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/028.webp\" alt=\"Relieve conforme e invertido\" loading=\"lazy\" data-cap=\"Relieve conforme e invertido\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve conforme e invertido<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Apalachense", "<div class=\"split\"><div class=\"sl\"><p>Relieve formado sobre una <b>cordillera antigua<\/b> (caledoniana o herciniana) <b>arrasada<\/b> por la erosión, que se <b>levanta de nuevo<\/b> en el Terciario y vuelve a erosionarse. Toma el nombre de los Apalaches.<\/p><p><span class=\"s-pdf\">Es el resultado de una larga evolución en cuatro fases:<\/span><\/p><ol class=\"steps\"><li><span class=\"s-pdf\">Plegamiento.<\/span><\/li><li><span class=\"s-pdf\">Arrasamiento erosivo: se forma una superficie de erosión.<\/span><\/li><li><span class=\"s-pdf\">Nuevo levantamiento tectónico de esa superficie.<\/span><\/li><li><span class=\"s-pdf\">Erosión diferencial sobre las rocas de la estructura plegada.<\/span><\/li><\/ol><h4>Partes y formas<\/h4><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Crestas<\/div><div class=\"td\">Las capas duras quedan en resalte formando sierras largas, paralelas y estrechas. <span class=\"s-pdf\">Barras paralelas de igual altura y no muy elevadas, en los estratos más resistentes (areniscas o cuarcitas).<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Surcos<\/div><div class=\"td\">Las capas blandas forman el fondo de los valles. <span class=\"s-pdf\">Depresiones largas y estrechas en rocas deleznables (pizarras, esquistos y margas).<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cluse viva (water gap)<\/div><div class=\"td\"><span class=\"s-pdf\">Paso estrecho y profundo que abre un río principal al atravesar las crestas.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Cluse muerta (wind gap)<\/div><div class=\"td\"><span class=\"s-pdf\">Paso por el que ya no circula ningún río: testimonio de uno desaparecido.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Red hidrográfica<\/div><div class=\"td\"><span class=\"s-pdf\">Los ríos menores se adaptan a crestas y surcos; los principales los atraviesan de forma indiferente a la estructura.<\/span><\/div><\/div><\/div><h4>En España<\/h4><div class=\"where\"><div class=\"wi\">Valles del <b>Eo y Navia<\/b> (Asturias), comarca de <b>Somiedo<\/b>, <b>Montes de Toledo<\/b> y <b>Sierra Morena<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Montes de Toledo: relieve de plegamiento antiguo cubierto de sedimentos que, tras una elevación por fractura y la posterior erosión, vuelve a salir a la luz.<\/span><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-A\"><img src=\"img/029.webp\" alt=\"Evolución del relieve apalachense\" loading=\"lazy\" data-cap=\"Evolución del relieve apalachense\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Evolución del relieve apalachense<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/030.webp\" alt=\"Crestas apalachenses, cluse viva y cluse muerta\" loading=\"lazy\" data-cap=\"Crestas apalachenses, cluse viva y cluse muerta\"><figcaption><span class=\"tag t-F\">PDF<\/span>Crestas apalachenses, cluse viva y cluse muerta<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/031.webp\" alt=\"Relieve apalachense\" loading=\"lazy\" data-cap=\"Relieve apalachense\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve apalachense<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/032.webp\" alt=\"Montes de Toledo\" loading=\"lazy\" data-cap=\"Montes de Toledo\"><figcaption><span class=\"tag t-P\">PPS<\/span>Montes de Toledo<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/033.webp\" alt=\"Anticlinal\" loading=\"lazy\" data-cap=\"Anticlinal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Anticlinal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/034.webp\" alt=\"Sinclinal\" loading=\"lazy\" data-cap=\"Sinclinal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Sinclinal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/035.webp\" alt=\"Sinclinal colgado (Cuenca)\" loading=\"lazy\" data-cap=\"Sinclinal colgado (Cuenca)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Sinclinal colgado (Cuenca)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/036.webp\" alt=\"Castillo de Acher (Pirineos)\" loading=\"lazy\" data-cap=\"Castillo de Acher (Pirineos)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Castillo de Acher (Pirineos)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/037.webp\" alt=\"Estructura plegada\" loading=\"lazy\" data-cap=\"Estructura plegada\"><figcaption><span class=\"tag t-F\">PDF<\/span>Estructura plegada<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><b>Relieve jurásico<\/b>: <b>Cordillera Cantábrica<\/b>, <b>Sistema Ibérico<\/b>, <b>Sistemas Béticos<\/b> y <b>Pirineos<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Pirineos y Sistemas Béticos, al plegarse los sedimentos de los geosinclinales en la orogenia alpina.<\/span><\/div><div class=\"wi\"><span class=\"s-pps\"><b>Baleares<\/b>: menos Menorca, son una continuación de la Cordillera Subbética.<\/span><\/div><div class=\"wi\"><span class=\"s-pdf\"><b>Relieve invertido<\/b>: sinclinal colgado en <b>Cuenca<\/b>; Castillo de Acher en los <b>Pirineos<\/b>.<\/span><\/div><\/div>"], ["Repaso", "<p><b>Relieve conforme y derivado.<\/b> Identifica cada número.<\/p><div class=\"ex\" id=\"ex6\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/038.webp\" alt=\"Formas del relieve plegado\" loading=\"lazy\" data-cap=\"Formas del relieve plegado\"><figcaption><span class=\"tag t-F\">PDF<\/span>Formas del relieve plegado<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Mont\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Chevron<\/option><option>Cluse<\/option><option>Combe<\/option><option>Cresta<\/option><option>Mont<\/option><option>Ruz<\/option><option>Sinclinal<\/option><option>Val<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Val\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Chevron<\/option><option>Cluse<\/option><option>Combe<\/option><option>Cresta<\/option><option>Mont<\/option><option>Ruz<\/option><option>Sinclinal<\/option><option>Val<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Combe\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Chevron<\/option><option>Cluse<\/option><option>Combe<\/option><option>Cresta<\/option><option>Mont<\/option><option>Ruz<\/option><option>Sinclinal<\/option><option>Val<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Cresta\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Chevron<\/option><option>Cluse<\/option><option>Combe<\/option><option>Cresta<\/option><option>Mont<\/option><option>Ruz<\/option><option>Sinclinal<\/option><option>Val<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">5<\/span><select data-q=\"Cluse\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Chevron<\/option><option>Cluse<\/option><option>Combe<\/option><option>Cresta<\/option><option>Mont<\/option><option>Ruz<\/option><option>Sinclinal<\/option><option>Val<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">6<\/span><select data-q=\"Chevron\"><optio ><option>Cluse<\/option><option>Combes<\/option><option>Sinclinal<\/option><option>Sinclinal colgado<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">7<\/span><select data-q=\"Anticlinal exhumado\"><option value=\"\">Elige…<\/option><option>Anticlinal<\/option><option>Anticlinal exhumado<\/option><option>Anticlinal vaciado<\/option><option>Cluse<\/option><option>Combes<\/option><option>Sinclinal<\/option><option>Sinclinal colgado<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex7')\">Comprobar<\/button><button onclick=\"resetEx('ex7')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><p><b>Relieve apalachense.<\/b> Identifica cada número.<\/p><div class=\"ex\" id=\"ex8\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/040.webp\" alt=\"Relieve apalachense\" loading=\"lazy\" data-cap=\"Relieve apalachense\"><figcaption><span class=\"tag t-F\">PDF<\/span>Relieve apalachense<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Cresta apalachense\"><option value=\"\">Elige…<\/option><option>Cluse muerta (wind gap)<\/option><option>Cluse viva (water gap)<\/option><option>Cresta apalachense<\/option><option>Escarpe de plataforma de roca dura<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Cluse viva (water gap)\"><option value=\"\">Elige…<\/option><option>Cluse muerta (wind gap)<\/option><option>Cluse viva (water gap)<\/option><option>Cresta apalachense<\/option><option>Escarpe de plataforma de roca dura<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Cluse muerta (wind gap)\"><option value=\"\">Elige…<\/option><option>Cluse muerta (wind gap)<\/option><option>Cluse viva (water gap)<\/option><option>Cresta apalachense<\ >Horst<\/div><div class=\"td\"><span class=\"s-pdf\">Bloque elevado entre fallas.<\/span> <span class=\"s-pps\">Corresponde a las sierras.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Graben o fosa tectónica<\/div><div class=\"td\"><span class=\"s-pdf\">Larga depresión hundida entre fallas normales paralelas.<\/span> <span class=\"s-pps\">Suele estar ocupada por valles fluviales.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Falla normal / falla inversa<\/div><div class=\"td\"><span class=\"s-pdf\">Normal: por tensión (los bloques se separan). Inversa: por compresión (un bloque monta sobre otro).<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/041.webp\" alt=\"Horst y graben\" loading=\"lazy\" data-cap=\"Horst y graben\"><figcaption><span class=\"tag t-F\">PDF<\/span>Horst y graben<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/042.webp\" alt=\"Elementos de una falla\" loading=\"lazy\" data-cap=\"Elementos de una falla\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Elementos de una falla<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/043.webp\" alt=\"Falla normal y falla inversa\" loading=\"lazy\" data-cap=\"Falla normal y falla inversa\"><figcaption><span class=\"tag t-F\">PDF<\/span>Falla normal y falla inversa<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/044.webp\" alt=\"Falla normal y falla inversa (bloques)\" loading=\"lazy\" data-cap=\"Falla normal y falla inversa (bloques)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Falla normal y falla inversa (bloques)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/045.webp\" alt=\"Graben entre fallas normales\" loading=\"lazy\" data-cap=\"Graben entre fallas normales\"><figcaption><span class=\"tag t-F\">PDF<\/span>Graben entre fallas normales<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/046.webp\" alt=\"Escarpes de falla\" loading=\"lazy\" data-cap=\"Escarpes de falla\"><figcaption><span class=\"tag t-F\">PDF<\/span>Escarpes de falla<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/047.webp\" alt=\"Horst y graben\" loading=\"lazy\" data-cap=\"Horst y graben\"><figcaption><span class=\"tag t-F\">PDF<\/span>Horst y graben<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/048.webp\" alt=\"Horst y graben\" loading=\"lazy\" data-cap=\"Horst y graben\"><figcaption><span class=\"tag t-P\">PPS<\/span>Horst y graben<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\">Cordilleras de bloques: <b>Sistema Central<\/b>, <b>Montes de Toledo<\/b>, <b>Macizo Galaico-Leonés<\/b>, sector occidental de la <b>Cordillera Cantábrica<\/b> y parte de las <b>Costero-Catalanas<\/b>.<\/div><div class=\"wi\"><span class=\"s-pps\">Interior de la Meseta fracturado en relieve germánico: <b>Montes de León<\/b>, <b>Sistema Central<\/b> y <b>Montes de Toledo<\/b>.<\/span><\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex9\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/049.webp\" alt=\"Falla normal y falla inversa\" loading=\"lazy\" data-cap=\"Falla normal y falla inversa\"><figcaption><span class=\"tag t-F\">PDF<\/span>Falla normal y falla inversa<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Bloque hundido\"><option value=\"\">Elige…<\/option><option>Bloque hundido<\/option><option>Bloque levantado<\/option><option>Falla inversa<\/option><option>Falla normal<\/option><option>Plano de falla<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Plano de falla\"><option value=\"\">Elige…<\/option><option>Bloque hundido<\/option><option>Bloque levantado<\/option><option>Falla inversa<\/option><option>Falla normal<\/option><option>Plano de falla<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Bloque levantado\"><option value=\"\">Elige…<\/option><option>Bloque hundido<\/option><option>Bloque levantado<\/option><option>Falla inversa<\/option><option>Falla normal<\/option><option>Plano de falla<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Falla normal\"><option value=\"\">Elige…<\/option><option>Bloque hundido<\/option><option>Bloque levantado<\/option><option>Falla inversa<\/option><option>Falla normal<\/option><option>Plano de falla<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">5<\/span><select data-q=\"Falla inversa\"><option value=\"\">Elige…<\/option><option>Bloque hundido<\/option><option>Bloque levantado<\/option><option>Falla inversa<\/option><option>Falla normal<\/option><option>Plano de falla<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex9')\">Comprobar<\/button><button onclick=\"resetEx('ex9')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex10\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/050.webp\" alt=\"Horst y graben\" loading=\"lazy\" data-cap=\"Horst y graben\"><figcaption><span class=\"tag t-F\">PDF<\/span>Horst y graben<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Horst\"><option value=\"\">Elige…<\/option><option>Graben<\/option><option>Horst<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Graben\"><option value=\"\">Elige…<\/option><option>Graben<\/option><option>Horst<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex10')\">Comprobar<\/button><button onclick=\"resetEx('ex10')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"fallado\"><\/div>"]], "sajonico": [["Qué es", "<p>Mezcla de los dos estilos: <b>estructura plegada sobre un zócalo fracturado<\/b>.<\/p><p><span class=\"s-pps\">Si sobre un zócalo antiguo (rocas duras) se han depositado sedimentos (rocas blandas) antes de la compresión, el <b>zócalo se fractura<\/b> y los <b>sedimentos de encima se pliegan<\/b>.<\/span><\/p><p><span class=\"s-yo\">Para recordarlo: abajo se comporta como el germánico y arriba como el jurásico.<\/span><\/p><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/051.webp\" alt=\"Relieve jurásico, germánico y sajónico\" loading=\"lazy\" data-cap=\"Relieve jurásico, germánico y sajónico\"><figcaption><span class=\"tag t-P\">PPS<\/span>Relieve jurásico, germánico y sajónico<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\"><span class=\"s-pps\">En la orogenia alpina la Meseta se inclina hacia el oeste y se rejuvenece, <b>arrugando sus bordes<\/b> en relieve sajónico: <b>Sistema Cantábrico<\/b>, <b>Sistema Ibérico<\/b>, <b>Sierra Morena<\/b> y <b>Macizo Galaico<\/b>.<\/span><\/div><\/div><div class=\"gal\"><figure class=\"fig src-P\"><img src=\"img/052.webp\" alt=\"La orogenia alpina: relieves germánico, sajónico y jurásico\" loading=\"lazy\" data-cap=\"La orogenia alpina: relieves germánico, sajónico y jurásico\"><figcaption><span class=\"tag t-P\">PPS<\/span>La orogenia alpina: relieves germánico, sajónico y jurásico<\/figcaption><\/figure><\/div>"], ["Repaso", "<div class=\"quiz\" data-k=\"sajonico\"><\/div>"]], "siliceo": [["Qué es", "<p>Se forma sobre el <b>zócalo paleozoico<\/b>: rocas ígneas y metamórficas antiguas (<b>granito<\/b>, pizarras, cuarcitas y gneis). El granito tiene cuarzo, feldespato y mica.<\/p><p><span class=\"s-pps\">Son rocas muy antiguas (del Precámbrico y del Paleozoico) e intrusivas.<\/span><\/p><p>Son rocas muy resistentes a la meteorización mecánica, pero sensibles a la <b>química<\/b>. La erosión se concentra en las <b>diaclasas<\/b> (fisuras), que acaban deshaciendo la roca en arenas.<\/p><p><span class=\"s-pdf\">Los relieves graníticos son producto de la <b>meteorización<\/b>, que altera la roca, y de la <b>erosión<\/b>, que elimina la parte alterada.<\/span> <span class=\"s-pps\">El modelado se debe principalmente a la <b>gelifracción<\/b> de sus diaclasas.<\/span><\/p>"], ["Formas mayores", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Domos<\/div><div class=\"td\">Formas redondeadas cuando las diaclasas son paralelas a la superficie: el granito se descama. <span class=\"s-pdf\">Relieves con paredes lisas y convexas (campaniformes, cupuliformes…), con bloques al pie. Se deben al diaclasado curvo y a la gelifracción. En España se llaman a veces <b>yelmos<\/b>.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Agujas y crestas<\/div><div class=\"td\">En alta montaña, por gelifracción: afiladas, con paredes verticales. <span class=\"s-pdf\">Las agujas se deben a diaclasas verticales; las crestas forman perfiles de sierra.<\/span> <span class=\"s-pps\">Crestas o galayos.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Panes de azúcar y medias naranjas<\/div><div class=\"td\">Grandes pitones en climas cálidos y húmedos. <span class=\"s-pdf\">No necesitan diaclasas curvas; al pie hay mantos de roca alterada, no bloques.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Berrocal<\/div><div class=\"td\">Concentración de bolos, tores y piedras caballeras (red de diaclasas ortogonal). <span class=\"s-pdf\">Rocas de perfil redondeado.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Canchal<\/div><div class=\"td\">Acumulación de fragmentos angulosos al pie de la montaña. <span class=\"s-pdf\">Rocas de perfil anguloso.<\/span> <span class=\"s-pps\">También pedrera.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Bolo<\/div><div class=\"td\">Roca suelta y redonda: la unidad básica.<\/div><\/div><div class=\"term\"><div class=\"tn\">Piedra caballera<\/div><div class=\"td\">Bola sobre otra más pequeña, en equilibrio precario.<\/div><\/div><div class=\"term\"><div class=\"tn\">Tor<\/div><div class=\"td\">Bolas apiladas. <span class=\"s-pdf\">Bloques que no se han desplazado y forman una especie de castillo.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Pedriza<\/div><div class=\"td\"><span class=\"s-pdf\">Acumulación de rocas redondeadas que procede de la erosión de los berrocales.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Lanchar<\/div><div class=\"td\"><span class=\"s-pdf\">Superficie lisa y algo convexa, como un pavimento de roca; suele estar en domos.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Penillanura y tajos<\/div><div class=\"td\">En las partes bajas: llanura ondulada con arenas en pasillos de arenización; los ríos se encajan y forman tajos.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/053.webp\" alt=\"Domo campaniforme, crestas, berrocales, domos cupuliformes, pedrizas y tors, lanchares\" loading=\"lazy\" data-cap=\"Domo campaniforme, crestas, berrocales, domos cupuliformes, pedrizas y tors, lanchares\"><figcaption><span class=\"tag t-F\">PDF<\/span>Domo campaniforme, crestas, berrocales, domos cupuliformes, pedrizas y tors, lanchares<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/054.webp\" alt=\"Tipos de domos\" loading=\"lazy\" data-cap=\"Tipos de domos\"><figcaption><span class=\"tag t-F\">PDF<\/span>Tipos de domos<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/055.webp\" alt=\"Relieve granítico\" loading=\"lazy\" data-cap=\"Relieve granítico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Relieve granítico<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/056.webp\" alt=\"Formas del granito según la altitud\" loading=\"lazy\" data-cap=\"Formas del granito según la altitud\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Formas del granito según la altitud<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Formas menores", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Acanaladuras<\/div><div class=\"td\"><span class=\"s-pdf\">Surcos más o menos verticales por donde corre el agua, en domos y bolos.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Pilancones<\/div><div class=\"td\"><span class=\"s-pdf\">Concavidades en lo alto de bolos y domos, por hidrólisis del agua retenida. En los ríos se llaman <b>marmitas de gigante<\/b>.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Taffoni<\/div><div class=\"td\">Cavidades por concentración de agua. <span class=\"s-pdf\">Horadan las paredes laterales y pueden dar rocas en forma de seta.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Nerviaciones<\/div><div class=\"td\"><span class=\"s-pdf\">Resaltes por filones más resistentes, como el cuarzo.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/057.webp\" alt=\"Acanaladuras (Sierra de Guadarrama)\" loading=\"lazy\" data-cap=\"Acanaladuras (Sierra de Guadarrama)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Acanaladuras (Sierra de Guadarrama)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/058.webp\" alt=\"Pilancones (Sierra de Guadarrama)\" loading=\"lazy\" data-cap=\"Pilancones (Sierra de Guadarrama)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Pilancones (Sierra de Guadarrama)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/059.webp\" alt=\"Marmita de gigante\" loading=\"lazy\" data-cap=\"Marmita de gigante\"><figcaption><span class=\"tag t-F\">PDF<\/span>Marmita de gigante<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/060.webp\" alt=\"Taffoni (Islas Cíes)\" loading=\"lazy\" data-cap=\"Taffoni (Islas Cíes)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Taffoni (Islas Cíes)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/061.webp\" alt=\"Nerviaciones\" loading=\"lazy\" data-cap=\"Nerviaciones\"><figcaption><span class=\"tag t-F\">PDF<\/span>Nerviaciones<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/062.webp\" alt=\"Domo (Sierra de Guadarrama)\" loading=\"lazy\" data-cap=\"Domo (Sierra de Guadarrama)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Domo (Sierra de Guadarrama)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/063.webp\" alt=\"Agujas\" loading=\"lazy\" data-cap=\"Agujas\"><figcaption><span class=\"tag t-F\">PDF<\/span>Agujas<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/064.webp\" alt=\"Crestas\" loading=\"lazy\" data-cap=\"Crestas\"><figcaption><span class=\"tag t-F\">PDF<\/span>Crestas<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/065.webp\" alt=\"Pan de azúcar (Río de Janeiro)\" loading=\"lazy\" data-cap=\"Pan de azúcar (Río de Janeiro)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Pan de azúcar (Río de Janeiro)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/066.webp\" alt=\"Berrocal\" loading=\"lazy\" data-cap=\"Berrocal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Berrocal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/067.webp\" alt=\"Canchal\" loading=\"lazy\" data-cap=\"Canchal\"><figcaption><span class=\"tag t-F\">PDF<\/span>Canchal<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/068.webp\" alt=\"Lanchares\" loading=\"lazy\" data-cap=\"Lanchares\"><figcaption><span class=\"tag t-F\">PDF<\/span>Lanchares<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/069.webp\" alt=\"Bolo\" loading=\"lazy\" data-cap=\"Bolo\"><figcaption><span class=\"tag t-F\">PDF<\/span>Bolo<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/070.webp\" alt=\"Piedra caballera (Sierra de Guadarrama)\" loading=\"lazy\" data-cap=\"Piedra caballera (Sierra de Guadarrama)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Piedra caballera (Sierra de Guadarrama)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/071.webp\" alt=\"Tor\" loading=\"lazy\" data-cap=\"Tor\"><figcaption><span class=\"tag t-F\">PDF<\/span>Tor<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/072.webp\" alt=\"Pico El Yelmo (Sistema Central)\" loading=\"lazy\" data-cap=\"Pico El Yelmo (Sistema Central)\"><figcaption><span class=\"tag t-P\">PPS<\/span>Pico El Yelmo (Sistema Central)<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/073.webp\" alt=\"Piedra caballera, tor y berrocal\" loading=\"lazy\" data-cap=\"Piedra caballera, tor y berrocal\"><figcaption><span class=\"tag t-P\">PPS<\/span>Piedra caballera, tor y berrocal<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/074.webp\" alt=\"Canchal y crestas\" loading=\"lazy\" data-cap=\"Canchal y crestas\"><figcaption><span class=\"tag t-P\">PPS<\/span>Canchal y crestas<\/figcaption><\/figure><\/div>"], ["En España", "<div class=\"where\"><div class=\"wi\">Oeste peninsular: <b>Galicia<\/b>, oeste de León, Zamora y Salamanca, <b>Extremadura<\/b>, oeste de la Cantábrica, <b>Sistema Central<\/b>, <b>Montes de Toledo<\/b> y <b>Sierra Morena<\/b>. También zona axial del Pirineo y sectores del Ibérico, Costero-Catalanas y Penibética.<\/div><div class=\"wi\"><span class=\"s-pps\">Oeste peninsular y zona axial de los plegamientos alpinos. Ejemplo: <b>Pico El Yelmo<\/b>.<\/span><\/div><div class=\"wi\"><span class=\"s-pdf\">Ejemplos: <b>Sierra de Guadarrama<\/b> (domos, piedras caballeras, acanaladuras, pilancones) e <b>Islas Cíes<\/b> (taffoni).<\/span><\/div><\/div>"], ["Repaso", "<p><b>Identifica<\/b> cada número del bloque diagrama.<\/p><div class=\"ex\" id=\"ex1\"><div class=\"exgrid\"><div><figure class=\"fig src-F\"><img src=\"img/075.webp\" alt=\"Bloque diagrama del relieve granítico\" loading=\"lazy\" data-cap=\"Bloque diagrama del relieve granítico\"><figcaption><span class=\"tag t-F\">PDF<\/span>Bloque diagrama del relieve granítico<\/figcaption><\/figure><\/div><div class=\"qs\"><div class=\"qrow\"><span class=\"qn\">1<\/span><select data-q=\"Domo campaniforme\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">2<\/span><select data-q=\"Crestas\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">3<\/span><select data-q=\"Berrocales\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">4<\/span><select data-q=\"Domos cupuliformes\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">5<\/span><select data-q=\"Pedrizas y tors\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"qrow\"><span class=\"qn\">6<\/span><select data-q=\"Lanchares\"><option value=\"\">Elige…<\/option><option>Domo campaniforme<\/option><option>Crestas<\/option><option>Berrocales<\/option><option>Domos cupuliformes<\/option><option>Pedrizas y tors<\/option><option>Lanchares<\/option><\/select><span class=\"qr\"><\/span><\/div><div class=\"exbtns\"><button class=\"primary\" onclick=\"checkEx('ex1')\">Comprobar<\/button><button onclick=\"resetEx('ex1')\">Reiniciar<\/button><\/div><p class=\"score\"><\/p><\/div><\/div><\/div><div class=\"quiz\" data-k=\"siliceo\"><\/div>"]], "karst": [["Qué es", "<p>Relieve originado por la <b>meteorización química<\/b> de rocas sedimentarias solubles. El agua con CO₂ se vuelve ácida y <b>disuelve el carbonato cálcico<\/b>; va creando galerías y cuevas.<\/p><p>Rocas sedimentarias del <b>Mesozoico<\/b> plegadas en la orogenia <b>alpina<\/b>: sobre todo <b>caliza<\/b>; también margas, yesos y sal gema. <span class=\"s-pps\">Calizas marinas del Mesozoico.<\/span><\/p><p><span class=\"s-pdf\">También se llama <b>carso<\/b>. Se da sobre rocas carbonatadas (calizas y dolomías), incluso mármoles, y en evaporitas (yeso, sal). El término <i>karst<\/i> procede de una región de Eslovenia, y muchos nombres de sus formas vienen del serbocroata.<\/span><\/p><p>Los ríos son raros en superficie: el agua circula bajo tierra. Se distinguen formas <b>exokársticas<\/b> (en superficie) y <b>endokársticas<\/b> (subterráneas).<\/p><div class=\"gal\"><figure class=\"fig src-U\"><img src=\"img/076.webp\" alt=\"Lapiaz, cañón, poljés, sumidero, dolina, sima, estalactitas, estalagmitas, surgencia, galería y caverna\" loading=\"lazy\" data-cap=\"Lapiaz, cañón, poljés, sumidero, dolina, sima, estalactitas, estalagmitas, surgencia, galería y caverna\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Lapiaz, cañón, poljés, sumidero, dolina, sima, estalactitas, estalagmitas, surgencia, galería y caverna<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/077.webp\" alt=\"Lapiaces, poljé, dolinas, cañón, sima y cueva\" loading=\"lazy\" data-cap=\"Lapiaces, poljé, dolinas, cañón, sima y cueva\"><figcaption><span class=\"tag t-F\">PDF<\/span>Lapiaces, poljé, dolinas, cañón, sima y cueva<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/078.webp\" alt=\"Bloque kárstico\" loading=\"lazy\" data-cap=\"Bloque kárstico\"><figcaption><span class=\"tag t-F\">PDF<\/span>Bloque kárstico<\/figcaption><\/figure><\/div>"], ["Exokársticas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Lapiaz o lenar<\/div><div class=\"td\">Surcos cortantes por el agua de lluvia. <span class=\"s-pdf\">Acanaladuras por disolución superficial. Los de arroyada tienen canales estrechos; los de fractura, grietas anchas.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Dolina (torca)<\/div><div class=\"td\">Depresión cerrada y redondeada. <span class=\"s-pdf\">Tipos: de cubeta, de embudo y de pozo. El fondo suele tener arcilla roja (<b>terra rossa<\/b>), buena para cultivar.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Uvala<\/div><div class=\"td\">Unión de varias dolinas. <span class=\"s-pdf\">Mayor que la dolina y de perfil sinuoso.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Poljé<\/div><div class=\"td\">Gran depresión alargada de fondo plano. <span class=\"s-pdf\">Puede tener cerros residuales (<b>hum<\/b>) y un río que desaparece por un <b>ponor<\/b>; se inunda periódicamente.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Hoces, foces, gargantas y cañones<\/div><div class=\"td\">Valles estrechos y profundos. <span class=\"s-pdf\">Paredes verticales con derrubios al pie; reciben agua de <b>surgencias<\/b> laterales.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Sima<\/div><div class=\"td\">Embudo o pozo vertical hacia las cavidades. <span class=\"s-pdf\">Por disolución o por hundimiento del techo de una cueva.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Ponor o sumidero<\/div><div class=\"td\">Por donde el agua entra al sistema subterráneo.<\/div><\/div><div class=\"term\"><div class=\"tn\">Tormo<\/div><div class=\"td\">Roca en forma de seta. <span class=\"s-pdf\">Gran bloque de caliza fungiforme de varios metros.<\/span><\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-U\"><img src=\"img/079.webp\" alt=\"Lapiaz o lenar: surcos y grietas abiertos por disolución de la caliza\" loading=\"lazy\" data-cap=\"Lapiaz o lenar: surcos y grietas abiertos por disolución de la caliza\"><figcaption><span class=\"tag t-U\">Tus imágenes<\/span>Lapiaz o lenar: surcos y grietas abiertos por disolución de la caliza<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/080.webp\" alt=\"Dolina y uvala\" loading=\"lazy\" data-cap=\"Dolina y uvala\"><figcaption><span class=\"tag t-P\">PPS<\/span>Dolina y uvala<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/081.webp\" alt=\"Paisaje kárstico\" loading=\"lazy\" data-cap=\"Paisaje kárstico\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Paisaje kárstico<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Endokársticas", "<div class=\"split\"><div class=\"sl\"><div class=\"terms\"><div class=\"term\"><div class=\"tn\">Cuevas o grutas<\/div><div class=\"td\">Galerías y salas excavadas por el agua subterránea. <span class=\"s-pdf\">El agua entra por las fisuras y disuelve la roca hasta encontrar salida.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Estalactitas<\/div><div class=\"td\">Cuelgan del techo. <span class=\"s-pdf\">Se forman por precipitación de la caliza disuelta en el agua que gotea.<\/span><\/div><\/div><div class=\"term\"><div class=\"tn\">Estalagmitas<\/div><div class=\"td\">Crecen desde el suelo.<\/div><\/div><div class=\"term\"><div class=\"tn\">Columnas<\/div><div class=\"td\">Unión de estalactita y estalagmita.<\/div><\/div><\/div><\/div><div class=\"sr\"><div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/082.webp\" alt=\"Estalactitas y estalagmitas\" loading=\"lazy\" data-cap=\"Estalactitas y estalagmitas\"><figcaption><span class=\"tag t-F\">PDF<\/span>Estalactitas y estalagmitas<\/figcaption><\/figure><figure class=\"fig src-P\"><img src=\"img/083.webp\" alt=\"Cueva o gruta\" loading=\"lazy\" data-cap=\"Cueva o gruta\"><figcaption><span class=\"tag t-P\">PPS<\/span>Cueva o gruta<\/figcaption><\/figure><figure class=\"fig src-A\"><img src=\"img/084.webp\" alt=\"Formas endokársticas\" loading=\"lazy\" data-cap=\"Formas endokársticas\"><figcaption><span class=\"tag t-A\">Apuntes<\/span>Formas endokársticas<\/figcaption><\/figure><\/div><\/div><\/div>"], ["Imágenes", "<div class=\"gal\"><figure class=\"fig src-F\"><img src=\"img/085.webp\" alt=\"Torcal de Antequera (Málaga)\" loading=\"lazy\" data-cap=\"Torcal de Antequera (Málaga)\"><figcaption><span class=\"tag t-F\">PDF<\/span>Torcal de Antequera (Málaga)<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/086.webp\" alt=\"Lapiaz\" loading=\"lazy\" data-cap=\"Lapiaz\"><figcaption><span class=\"tag t-F\">PDF<\/span>Lapiaz<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/087.webp\" alt=\"Dolinas\" loading=\"lazy\" data-cap=\"Dolinas\"><figcaption><span class=\"tag t-F\">PDF<\/span>Dolinas<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/088.webp\" alt=\"Uvalas\" loading=\"lazy\" data-cap=\"Uvalas\"><figcaption><span class=\"tag t-F\">PDF<\/span>Uvalas<\/figcaption><\/figure><figure class=\"fig src-F\"><img src=\"img/089.webp\" alt=\"Cañón de los Almadenes, Cieza (Murcia)\" loading=\"lazy\" data-cap=\"Cañón de los Almadenes, Cieza (Murcia)\"><figcaption><span class=\"ta
